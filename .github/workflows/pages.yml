name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - 'script/cheap-lfs-pages-test.mjs'
      - 'script/cheap-lfs-vs-git-lfs-pages-test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp -r site/* _site/
          rm -f _site/docs-template.html _site/md-links.lua _site/docs-search.html
          mkdir -p _site/docs/assets/screenshots
          cp -r docs/assets/screenshots/* _site/docs/assets/screenshots/
          cp site/docs-search.html _site/docs/search.html

      # The Docs button serves the complete rendered documentation set from
      # GitHub Pages itself rather than redirecting to github.com.
      - name: Render documentation to HTML
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for src in docs/**/*.md; do
            rel="${src#docs/}"
            case "$(basename "$src")" in
              README.md) out="_site/docs/$(dirname "$rel")/index.html" ;;
              *) out="_site/docs/${rel%.md}.html" ;;
            esac
            out="${out/\/.\///}"
            mkdir -p "$(dirname "$out")"
            depth="$(dirname "$rel" | tr -cd '/' | wc -c)"
            if [ "$(dirname "$rel")" = "." ]; then
              docsroot=""
            else
              docsroot="$(printf '../%.0s' $(seq 0 "$depth"))"
            fi
            title="$(sed -n 's/^# //p' "$src" | head -1)"
            [ -n "$title" ] || title="$(basename "${src%.md}")"
            pandoc "$src" \
              --from gfm \
              --to html5 \
              --standalone \
              --template site/docs-template.html \
              --lua-filter site/md-links.lua \
              --metadata pagetitle="$title" \
              --variable docsroot="$docsroot" \
              --output "$out"
          done
          # Root-level project documents referenced from docs/ (ROADMAP,
          # HANDOFF, …). The site homepage stays site/index.html, so the
          # repository README renders as README.html rather than index.html.
          for src in *.md; do
            pandoc "$src" \
              --from gfm \
              --to html5 \
              --standalone \
              --template site/docs-template.html \
              --lua-filter site/md-links.lua \
              --metadata pagetitle="${src%.md}" \
              --variable docsroot="docs/" \
              --output "_site/${src%.md}.html"
          done
          test -f _site/docs/index.html

      # The hand-built Material Design 3 hub becomes /docs/. The pandoc loop
      # above rendered docs/README.md to that same path, so the Markdown index
      # keeps its own stable URL at /docs/README.html and nothing is lost.
      - name: Publish the documentation hub
        run: |
          set -euo pipefail
          pandoc docs/README.md \
            --from gfm \
            --to html5 \
            --standalone \
            --template site/docs-template.html \
            --lua-filter site/md-links.lua \
            --metadata pagetitle="Desktop Material documentation" \
            --variable docsroot="" \
            --output _site/docs/README.html
          cp docs/index.html _site/docs/index.html
          mkdir -p _site/docs/assets/site
          cp -R docs/assets/site/. _site/docs/assets/site/
          test -f _site/docs/README.html
          test -f _site/docs/assets/site/docs-hub.js
          grep -q 'docs-hub-catalog.js' _site/docs/index.html
          # Both /docs/index.html and /docs/search.html resolve the shared
          # regex runner and worker relatively from /docs/, so publishing one
          # surface without them would ship a search box that fails closed.
          test -f _site/docs/assets/site/docs-regex-job.js
          test -f _site/docs/assets/site/docs-hub-regex-worker.js
          # The per-screenshot documentation pages live outside the Markdown
          # tree, so the pandoc pass never sees them. Without this copy
          # /docs/screenshots/ and every page under it 404 while still being
          # linked from the gallery, which is worse than not shipping them.
          if [ -d docs/screenshots ]; then
            mkdir -p _site/docs/screenshots
            cp -R docs/screenshots/. _site/docs/screenshots/
            test -f _site/docs/screenshots/index.html
            test -f _site/docs/screenshots/screenshot-docs.css
            # Prove the gallery module and its strings actually shipped, since
            # a page without them renders every control as a dead placeholder.
            test -f _site/docs/assets/site/docs-screenshot-gallery.js
            test -f _site/docs/assets/site/docs-screenshot-strings.js
          fi

      - name: Set up Node.js for the Cheap LFS guide contract
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install the locked Cheap LFS guide test dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Validate the Cheap LFS visual guide
        run: |
          node script/cheap-lfs-pages-test.mjs _site

      - name: Validate the Cheap LFS comparison atlas
        run: |
          node script/cheap-lfs-vs-git-lfs-pages-test.mjs _site

      # GitHub renders ```mermaid fences natively; pandoc turns them into
      # <pre> blocks, so the published site used to show diagram source. The
      # renderer below is installed outside the checkout so it cannot disturb
      # the repository's own yarn-managed modules.
      - name: Install the Mermaid pre-renderer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mermaid-toolchain"
          cd "$RUNNER_TEMP/mermaid-toolchain"
          npm init --yes >/dev/null
          npm install --no-audit --no-fund \
            @mermaid-js/mermaid-cli@11 puppeteer@25
          npx puppeteer browsers install chrome

      # Runs before the search index so diagram labels are indexed as page
      # text, and with --require-toolchain so a build that cannot render a
      # diagram fails instead of publishing the fence source.
      - name: Pre-render Mermaid diagrams to inline SVG
        run: |
          set -euo pipefail
          node site/render-mermaid.mjs _site --require-toolchain \
            --toolchain "$RUNNER_TEMP/mermaid-toolchain"
          rm -f _site/render-mermaid.mjs
          test ! -f _site/render-mermaid.mjs
          grep -q '<svg' _site/docs/learn-more/unreachable-commits.html
          ! grep -q 'pre class="mermaid"' \
            _site/docs/learn-more/unreachable-commits.html

      - name: Build documentation search index
        run: |
          node site/build-search-index.js _site
          rm -f _site/build-search-index.js
          test -s _site/docs/search-index.json
          test -f _site/docs/search.html
          grep -q 'assets/site/docs-regex-job.js' _site/docs/search.html
          grep -q 'assets/site/docs-hub-regex-worker.js' _site/docs/search.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
