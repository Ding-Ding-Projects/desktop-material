name: Build Installers / Express Release

# A successful main CI run still publishes automatically. Manual dispatch is
# the express lane: lint, Windows x64 unit/script tests, and the x64 build run in parallel,
# then one create-only publisher releases the exact main commit. Installed
# dependencies use an exact content cache; build and release outputs are never
# cached because they embed the source SHA, version, and runtime configuration.

on:
  workflow_run:
    workflows:
      - CI Windows
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Release-note code names are selected from the existing published-release
  # inventory. Serialize the whole publisher so two workflow_run events cannot
  # choose the same dish before either release becomes visible to the API.
  group: build-installers-publisher-${{ github.repository }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Resolve exact main release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      proceed: ${{ steps.target.outputs.proceed }}
      publish: ${{ steps.target.outputs.publish }}
      block_reason: ${{ steps.target.outputs.block_reason }}
      windows_ok: ${{ steps.target.outputs.windows_ok }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: ./.github/actions/setup-github-cli
      - name: Require a successful main CI or a main dispatch
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_LANE: ${{ github.event.workflow_run.name }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_REPOSITORY:
            ${{ github.event.workflow_run.head_repository.full_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          windows_ok=true
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$CI_EVENT" != "push" ] || \
               [ "$CI_BRANCH" != "main" ] || \
               [ "$CI_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              # A workflow_run completion can represent a cancelled manual
              # dispatch, a fork, or another non-publishable source. It is a
              # neutral skip, not a release-build failure: no installer may
              # be produced, but the guard itself must not create a red run.
              echo "Installer packaging skipped: the completed workflow was not this repository's main push CI."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CI_CONCLUSION" = "cancelled" ]; then
              echo "Installer packaging skipped: a newer validation replaced this main CI run."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CI_LANE" != "CI Windows" ]; then
              echo "Installer packaging skipped: only CI Windows can publish the desktop release."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target="$CI_SHA"
            if [ "$CI_CONCLUSION" = "success" ]; then
              ci_can_publish=true
              block_reason=
            else
              ci_can_publish=false
              block_reason=ci-failed
              echo "CI Windows concluded '$CI_CONCLUSION'; packaging an artifact but blocking Release publication."
              echo "CI Windows failed; no Release will be published."
            fi
          else
            if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
              echo "Express Release must be dispatched from main." >&2
              exit 1
            fi
            target="$DISPATCH_SHA"
            ci_can_publish=true
            block_reason=
          fi

          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release target is not an exact commit SHA." >&2
            exit 1
          fi
          # Every exact successful main build gets its own immutable Release.
          publish="$ci_can_publish"
          {
            echo "proceed=true"
            echo "windows_ok=$windows_ok"
            echo "sha=$target"
            echo "publish=$publish"
            echo "block_reason=$block_reason"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        if: steps.target.outputs.proceed == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.target.outputs.proceed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Stamp cross-lane monotonic release version
        id: version
        if: steps.target.outputs.proceed == 'true'
        shell: bash
        env:
          RELEASE_TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
          base=$(node -p "require('./app/package.json').version")
          version=$(node script/release-version.js create "$base" "${{ github.run_id }}" "${{ github.run_attempt }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require a new immutable release tag
        if:
          steps.target.outputs.proceed == 'true' && steps.target.outputs.publish
          == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            0)
              echo "Release tag $tag already exists; refusing to replace immutable release assets." >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Unable to prove release tag $tag is absent (git ls-remote exited $status)." >&2
              exit "$status"
              ;;
          esac

  lint:
    name: Express lint
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: git submodule update --init --recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code

  test:
    name: Express tests Windows x64
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Initial checkout for Windows bootstrap
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Bootstrap Git and Bash for self-hosted Windows
        shell: cmd
        run: "%GITHUB_WORKSPACE%\\.github\\scripts\\ensure-windows-git-bash.cmd"
      - name: Repeat checkout with bootstrapped Git
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Prove cold Windows release bootstrap
        shell: cmd
        run: "%GITHUB_WORKSPACE%\\.github\\scripts\\test-windows-release-bootstrap.cmd"
      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: |
          # prefer the new official mirror for the lowlevel MCP submodule if present
          git config --local submodule.vendor/lowlevel-computer-use-mcp.url https://github.com/Ding-Ding-Projects/lowlevel-computer-use-mcp.git
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install --frozen-lockfile --production=false
          npx --no-install node-gyp rebuild
          yarn build
          yarn test
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: x64
          TARGET_ARCH: x64
      - name: Run unit tests
        run: yarn test:unit
        # script/test.mjs owns both the worker heap limit and the concurrency
        # budget. A workflow-level NODE_OPTIONS override is inherited by every
        # worker and makes the harness underestimate its peak memory use.
      - name: Run script tests
        run: yarn test:script

  release_notes:
    name: Release notes
    # Notes describe the commit, not a platform, so they are built off both
    # lanes. Leaving them inside the Windows job meant a red Windows lane took
    # the notes down with the installers and left nothing to publish at all.
    if: needs.prepare.outputs.proceed == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: git submodule update --init --recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - run: mkdir -p release-payload
      - name: Generate bounded exact-SHA release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn --silent ts-node -P script/tsconfig.json \
            script/generate-automated-release-notes.ts \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --release-sha "$RELEASE_TARGET_SHA" \
            --output "release-payload/release-notes.md"
      # The shared instructions put the line count in the release rather than
      # only the README, and require CI to be what measures it: this runs over
      # the exact commit being released, in the same run that built the
      # artifacts, so no hand-typed number can drift from the tree.
      - name: Append the measured line count to the release notes
        shell: bash
        run: |
          {
            printf '\n## Lines of code\n\n'
            node script/count-lines.mjs
            printf '\nCounted by CI over \140%s\140 with \140node script/count-lines.mjs\140.\n' \
              "$RELEASE_TARGET_SHA"
          } >> release-payload/release-notes.md
      - name: Append verified dim-sum release code name
        shell: bash
        env:
          GH_TOKEN:
            ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN ||
            secrets.GITHUB_TOKEN }}
        run: |
          metadata_ready=true
          if ! gh api \
            repos/Ding-Ding-Projects/dim-sum-photos/contents/catalog/index.json \
            -H 'Accept: application/vnd.github.raw+json' \
            > release-payload/dim-sum-catalog.json; then
            metadata_ready=false
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate --jq '.[].body // ""' \
            > release-payload/prior-release-bodies.txt; then
            metadata_ready=false
          fi
          if ! gh api \
            'repos/Ding-Ding-Projects/dim-sum-photos/releases?per_page=100' \
            --paginate --jq '
              .[] | select(.tag_name | startswith("catalog-v1")) |
              [.id, .tag_name] | @tsv
            ' > release-payload/dim-sum-catalog-releases.tsv; then
            metadata_ready=false
          fi
          : > release-payload/published-dim-sum-assets.tsv
          if [ ! -s release-payload/dim-sum-catalog-releases.tsv ]; then
            metadata_ready=false
          else
            while IFS=$'\t' read -r catalog_release_id catalog_release_tag; do
              if ! gh api \
                "repos/Ding-Ding-Projects/dim-sum-photos/releases/$catalog_release_id/assets?per_page=100" \
                --paginate --jq '.[].name' \
                > release-payload/dim-sum-release-assets.txt; then
                metadata_ready=false
                break
              fi
              while IFS= read -r asset_name; do
                printf '%s\t%s\n' "$catalog_release_tag" "$asset_name"
              done < release-payload/dim-sum-release-assets.txt \
                >> release-payload/published-dim-sum-assets.tsv
            done < release-payload/dim-sum-catalog-releases.tsv
          fi
          if [ "$metadata_ready" = true ]; then
            choice=$(jq -c \
              --rawfile used release-payload/prior-release-bodies.txt \
              --rawfile published release-payload/published-dim-sum-assets.tsv '
              ($published | split("\n") |
                map(select(length > 0) | split("\t")) |
                map({ key: .[1], value: .[0] }) | from_entries) as $assets |
              [.dishes[] | . as $dish |
                ($dish.image.path | split("/")[-1]) as $file |
                select(($used | contains($dish.name.en + " · " + $dish.name.zhHant)) | not) |
                select($assets[$file] != null) |
                { dish: $dish, file: $file, tag: $assets[$file] }][0] // empty
            ' release-payload/dim-sum-catalog.json)
            if [ -n "$choice" ]; then
              dish_name=$(jq -r '.dish.name.en + " · " + .dish.name.zhHant' <<<"$choice")
              dish_file=$(jq -r .file <<<"$choice")
              dish_tag=$(jq -r .tag <<<"$choice")
              {
                echo
                echo '## Release code name'
                echo
                echo "$dish_name"
                echo
                echo "[Public dish photo](https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/download/$dish_tag/$dish_file)"
              } >> release-payload/release-notes.md
            else
              echo '::warning::No unused dim-sum code name with a published photo was available; releasing with the version only.'
            fi
          else
            echo '::warning::Dim-sum release metadata could not be proven complete; releasing with the version only.'
          fi
      - name: Preserve exact release notes
        uses: actions/upload-artifact@v7
        with:
          name:
            express-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/release-notes.md
          if-no-files-found: error
          retention-days: 3

  package:
    name: Windows x64
    # Preserve a diagnostic installer payload when Windows passed. Publication
    # requires this tested desktop payload.
    if:
      needs.prepare.outputs.proceed == 'true' &&
      needs.prepare.outputs.windows_ok == 'true'
    needs: prepare
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NODE_ENV: production
      RELEASE_CHANNEL: beta
    steps:
      - name: Initial checkout for Windows bootstrap
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Bootstrap Git and Bash for self-hosted Windows
        shell: cmd
        run: "%GITHUB_WORKSPACE%\\.github\\scripts\\ensure-windows-git-bash.cmd"
      - name: Repeat checkout with bootstrapped Git
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: git submodule update --init --recursive
      - name: Require the prepared exact commit
        shell: bash
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match release target $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - name: Apply prepared release version
        shell: bash
        run: |
          node -e "const f='./app/package.json';const p=require(f);p.version='$RELEASE_VERSION';require('fs').writeFileSync(f, JSON.stringify(p, null, 2) + '\n')"
      - name: Build production app
        run: yarn build:prod
        env:
          WEBPACK_DISABLE_CONCURRENT_RECOMPILATION: '1'
          npm_config_arch: x64
          TARGET_ARCH: x64
      - name: Package production app
        run: yarn package
        env:
          WINDOWS_SIGNING_ENABLED: 'false'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
          AZURE_CLIENT_ID: ''
          AZURE_TENANT_ID: ''
          npm_config_arch: x64
          TARGET_ARCH: x64
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-payload/installers
          shopt -s nullglob
          for f in \
            "dist/GitHub Desktop-x64.zip" \
            dist/GitHubDesktop-*.nupkg \
            "dist/GitHubDesktopSetup-x64.exe" \
            "dist/GitHubDesktopSetup-x64.msi"; do
            [ -e "$f" ] && cp "$f" release-payload/installers/
          done
          if [ -e dist/RELEASES ]; then
            # Squirrel installs the highest version the manifest names, so the
            # published feed must only ever name this package at this version.
            node script/release-version.js filter "$RELEASE_VERSION" \
              < dist/RELEASES > release-payload/installers/RELEASES
            while read -r _sha name _size || [[ -n "$name" ]]; do
              [ -z "$name" ] && continue
              [ -e "release-payload/installers/$name" ] && continue
              case "$name" in
                *-full.nupkg)
                  src=$(find dist -maxdepth 1 -type f -name '*-full.nupkg' -print | LC_ALL=C sort | sed -n '1p')
                  ;;
                *-delta.nupkg)
                  src=$(find dist -maxdepth 1 -type f -name '*-delta.nupkg' -print | LC_ALL=C sort | sed -n '1p')
                  ;;
                *) src="" ;;
              esac
              if [[ "$name" == *-full.nupkg || "$name" == *-delta.nupkg ]] && \
                 [ -z "$src" ]; then
                echo "RELEASES names $name, but no matching source package exists." >&2
                exit 1
              fi
              [ -n "$src" ] && cp "$src" "release-payload/installers/$name"
            done < release-payload/installers/RELEASES
          fi
          ls -la release-payload/installers
      - name: Verify required release assets
        shell: bash
        run: |
          required=(
            release-payload/installers/RELEASES
            "release-payload/installers/GitHub Desktop-x64.zip"
            release-payload/installers/GitHubDesktopSetup-x64.exe
            release-payload/installers/GitHubDesktopSetup-x64.msi
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-full.nupkg"
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"
          )
          for asset in "${required[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty required release asset: $asset" >&2
              exit 1
            fi
          done
      - name: Require unsigned release installers
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $installers = @(
            'release-payload\installers\GitHubDesktopSetup-x64.exe',
            'release-payload\installers\GitHubDesktopSetup-x64.msi'
          )
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Installer must remain unsigned: ${installer} reported $($signature.Status)"
            }
            Write-Host "Unsigned installer verified: $installer"
          }
      - name: Preserve express installer payload
        uses: actions/upload-artifact@v7
        with:
          name: express-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Preserve the upstream CI failure result
        if: needs.prepare.outputs.block_reason == 'ci-failed'
        shell: bash
        run: |
          echo "Installer recovery artifacts were preserved, but this run cannot publish because its upstream CI failed." >&2
          exit 1

  prepare_publication:
    name: Prepare GitHub release payload
    needs:
      - prepare
      - lint
      - test
      - release_notes
      - package
    # Publication requires the tested Windows desktop payload. A failed or
    # cancelled validation run creates no partial Release.
    if: >-
      !cancelled() && always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.proceed == 'true' && needs.prepare.outputs.publish
      == 'true' && needs.release_notes.result == 'success' &&
      needs.package.result == 'success' && (github.event_name == 'workflow_run'
      ||
       (needs.lint.result == 'success' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # Publishing verifies the tag explicitly below, so a shallow source
          # checkout is sufficient and avoids redundant history transfer.
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-github-cli
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        if: needs.package.result == 'success'
        with:
          name: express-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/installers
      - uses: actions/download-artifact@v8
        with:
          name:
            express-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload
      - name: Verify downloaded release payload
        shell: bash
        env:
          HAVE_INSTALLERS: ${{ needs.package.result == 'success' }}
        run: |
          # The desktop payload is demanded in full or not at all. A failed
          # validation run contributes no installer and says so.
          required=(release-payload/release-notes.md)
          if [ "$HAVE_INSTALLERS" = true ]; then
            required+=(
              release-payload/installers/RELEASES
              "release-payload/installers/GitHub Desktop-x64.zip"
              release-payload/installers/GitHubDesktopSetup-x64.exe
              release-payload/installers/GitHubDesktopSetup-x64.msi
              "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-full.nupkg"
              "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"
            )
          else
            echo "CI Windows did not pass; this Release ships without the desktop installers."
          fi
          for asset in "${required[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty downloaded release payload: $asset" >&2
              exit 1
            fi
          done

      - name: Preserve verified release payload
        uses: actions/upload-artifact@v7
        with:
          name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - prepare_publication
    if: >-
      !cancelled() && always() && needs.prepare.result == 'success' &&
      needs.prepare_publication.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-github-cli
      - uses: actions/download-artifact@v8
        with:
          name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload
      - name: Revalidate immutable release tag before publishing
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            0)
              echo "Release tag $tag appeared while building; refusing to update an existing release." >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Unable to prove release tag $tag is absent (git ls-remote exited $status)." >&2
              exit "$status"
              ;;
          esac

      - name: Publish GitHub release
        shell: bash
        # RELEASE_TOKEN (a fine-grained PAT with Contents write on this repo)
        # takes precedence when configured: since 2026-07-26 the workflow token
        # is refused by POST /releases (issue #44), while a user PAT publishes
        # fine. An empty/absent secret falls back to the workflow token.
        env:
          GH_TOKEN:
            ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN ||
            secrets.GITHUB_TOKEN }}
        run: |
          set +e
          shopt -s nullglob
          assets=(release-payload/installers/*)
          shopt -u nullglob
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Desktop Material $RELEASE_VERSION" \
            --notes-file release-payload/release-notes.md \
            --latest=false
          create_status=$?
          set -e
          if [ "$create_status" -ne 0 ]; then
            # 2026-07-26: the workflow token began receiving 403s from
            # POST /releases for non-prerelease creation while prerelease
            # creation kept succeeding (runs 30187367300, 30187848822).
            # Recover by creating the release as a prerelease, uploading the
            # same assets, then clearing the flag. If the final edit also
            # fails, the run fails loudly with the prerelease left intact.
            echo "Direct release creation failed with status $create_status;" \
              "falling back to prerelease-then-clear." >&2
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_TARGET_SHA" \
              -f name="Desktop Material $RELEASE_VERSION" \
              -F prerelease=true \
              -f make_latest=false \
              -F body=@release-payload/release-notes.md >/dev/null
            gh release upload "$RELEASE_TAG" \
              release-payload/installers/* \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false --latest=false
          fi
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft \
            > release-payload/published-is-draft.txt
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            > release-payload/published-assets.txt
      - name: Verify published release target
        shell: bash
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG"
          published=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$published" != "$RELEASE_TARGET_SHA" ]; then
            echo "Published tag resolves to $published, expected $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
          if [ "$(cat release-payload/published-is-draft.txt)" != "false" ]; then
            echo "Published release unexpectedly remained a draft." >&2
            exit 1
          fi
          published_assets=$(cat release-payload/published-assets.txt)
          # GitHub's release asset API normalizes spaces in this filename.
          for expected in RELEASES \
            "GitHub.Desktop-x64.zip" \
            GitHubDesktopSetup-x64.exe \
            GitHubDesktopSetup-x64.msi \
            "GitHubDesktop-${RELEASE_VERSION}-full.nupkg" \
            "GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"; do
            if ! grep -Fqx "$expected" <<<"$published_assets"; then
              echo "Published release is missing desktop asset $expected." >&2
              exit 1
            fi
          done
      - name: Finalize exact workflow timing in release notes
        env:
          GH_TOKEN:
            ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN ||
            secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          workflow_started=''
          workflow_completed=''
          for _ in 1 2 3 4 5 6; do
            jobs=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")
            workflow_started=$(jq -r \
              '[.jobs[].started_at | select(type == "string")] | min // empty' \
              <<<"$jobs")
            workflow_completed=$(jq -r '
              [.jobs[].steps[]? |
                select(.name == "Publish GitHub release") |
                .completed_at | select(type == "string")] | max // empty
            ' <<<"$jobs")
            if [[ "$workflow_started" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] &&
              [[ "$workflow_completed" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
              break
            fi
            sleep 5
          done
          if [[ ! "$workflow_started" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] ||
            [[ ! "$workflow_completed" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            echo 'Exact first-job or release-publication timing is unavailable.' >&2
            exit 1
          fi
          workflow_duration=$(node - "$workflow_started" "$workflow_completed" <<'NODE'
          const started = Date.parse(process.argv[2])
          const completed = Date.parse(process.argv[3])
          if (!Number.isFinite(started) || !Number.isFinite(completed) || completed < started) {
            process.exit(1)
          }
          const seconds = Math.floor((completed - started) / 1000)
          const hh = String(Math.floor(seconds / 3600)).padStart(2, '0')
          const mm = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0')
          const ss = String(seconds % 60).padStart(2, '0')
          process.stdout.write(`${hh}:${mm}:${ss}`)
          NODE
          )
          {
            echo
            echo '## Workflow timing'
            echo
            echo "- Workflow started: \`$workflow_started\`"
            echo "- Workflow completed: \`$workflow_completed\`"
            echo "- Workflow duration: \`$workflow_duration\`"
          } >> release-payload/release-notes.md
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-payload/release-notes.md

          body=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body)
          grep -Fq -- "- Workflow started: \`$workflow_started\`" <<<"$body"
          grep -Fq -- "- Workflow completed: \`$workflow_completed\`" <<<"$body"
          grep -Fq -- "- Workflow duration: \`$workflow_duration\`" <<<"$body"
      - name: Reconcile Latest to the newest main release
        shell: bash
        env:
          GH_TOKEN:
            ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN ||
            secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/promote-current-release.sh
