name: Build Installers / Express Release

# A successful main CI run still publishes automatically. Manual dispatch is
# the express lane: lint, Windows x64 unit/script tests, and the x64 build run in parallel,
# then one create-only publisher releases the exact main commit. Installed
# dependencies use an exact content cache; build and release outputs are never
# cached because they embed the source SHA, version, and runtime configuration.

on:
  workflow_run:
    workflows:
      - CI Linux
      - CI Windows
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-installers-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Resolve exact main release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      proceed: ${{ steps.target.outputs.proceed }}
      publish: ${{ steps.target.outputs.publish }}
      block_reason: ${{ steps.target.outputs.block_reason }}
      windows_ok: ${{ steps.target.outputs.windows_ok }}
      linux_ok: ${{ steps.target.outputs.linux_ok }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: ./.github/actions/setup-github-cli
      - name: Require a successful main CI or a main dispatch
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_LANE: ${{ github.event.workflow_run.name }}
          CI_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_REPOSITORY:
            ${{ github.event.workflow_run.head_repository.full_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          windows_ok=true
          linux_ok=true
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$CI_EVENT" != "push" ] || \
               [ "$CI_BRANCH" != "main" ] || \
               [ "$CI_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              # A workflow_run completion can represent a cancelled manual
              # dispatch, a fork, or another non-publishable source. It is a
              # neutral skip, not a release-build failure: no installer may
              # be produced, but the guard itself must not create a red run.
              echo "Installer packaging skipped: the completed workflow was not this repository's main push CI."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target="$CI_SHA"

            # The two lanes are separate workflows so neither can withhold the
            # other's assets, but this commit still gets exactly one Release.
            # Whichever lane finishes last publishes; the one that finishes
            # first stands down, because its sibling is still running and the
            # Release would be short its half of the payload.
            case "$CI_LANE" in
              "CI Windows") sibling="CI Linux" ;;
              "CI Linux") sibling="CI Windows" ;;
              *)
                echo "Installer packaging blocked: '$CI_LANE' is not a known CI lane." >&2
                exit 1
                ;;
            esac
            sibling_fields=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CI_SHA&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$sibling\")]
                    | sort_by(.run_number) | last // empty
                    | [.status, (.conclusion // \"\"), .updated_at] | @tsv")
            if [ -z "$sibling_fields" ]; then
              echo "Installer packaging blocked: no $sibling run found for $CI_SHA." >&2
              exit 1
            fi
            IFS=$'\t' read -r sibling_status sibling_conclusion sibling_updated <<< "$sibling_fields"
            if [ "$sibling_status" != "completed" ]; then
              echo "$sibling is still $sibling_status; it will publish this commit once it finishes."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Both are done. On the vanishingly rare identical timestamp the
            # Windows lane is the tie-breaker, so the pair still elects one.
            if [ "$sibling_updated" \> "$CI_UPDATED_AT" ] || \
               { [ "$sibling_updated" = "$CI_UPDATED_AT" ] && [ "$CI_LANE" != "CI Windows" ]; }; then
              echo "$sibling finished later; it publishes this commit."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$CI_LANE" = "CI Windows" ]; then
              [ "$CI_CONCLUSION" = "success" ] || windows_ok=false
              [ "$sibling_conclusion" = "success" ] || linux_ok=false
            else
              [ "$CI_CONCLUSION" = "success" ] || linux_ok=false
              [ "$sibling_conclusion" = "success" ] || windows_ok=false
            fi

            # A lane withholds only its own assets. The Release still happens
            # as long as one lane vouched for something to put in it.
            if [ "$windows_ok" = true ] || [ "$linux_ok" = true ]; then
              ci_can_publish=true
              block_reason=
            else
              ci_can_publish=false
              block_reason=ci-failed
              echo "CI concluded '$CI_CONCLUSION'; packaging an artifact but blocking Release publication."
            fi
            [ "$windows_ok" = true ] || echo "CI Windows failed; this Release ships without the desktop installers."
            [ "$linux_ok" = true ] || echo "CI Linux failed; this Release ships without the terminal edition package."
          else
            if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
              echo "Express Release must be dispatched from main." >&2
              exit 1
            fi
            target="$DISPATCH_SHA"
            ci_can_publish=true
            block_reason=
          fi

          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release target is not an exact commit SHA." >&2
            exit 1
          fi
          # Every exact successful main build gets its own immutable Release,
          # even when a newer main commit arrives while jobs overlap.
          publish="$ci_can_publish"
          {
            echo "proceed=true"
            echo "windows_ok=$windows_ok"
            echo "linux_ok=$linux_ok"
            echo "sha=$target"
            echo "publish=$publish"
            echo "block_reason=$block_reason"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        if: steps.target.outputs.proceed == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.target.outputs.proceed == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Stamp cross-lane monotonic release version
        id: version
        if: steps.target.outputs.proceed == 'true'
        shell: bash
        env:
          RELEASE_TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
          base=$(node -p "require('./app/package.json').version")
          version=$(node script/release-version.js create "$base" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require a new immutable release tag
        if:
          steps.target.outputs.proceed == 'true' && steps.target.outputs.publish
          == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            0)
              echo "Release tag $tag already exists; refusing to replace immutable release assets." >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Unable to prove release tag $tag is absent (git ls-remote exited $status)." >&2
              exit "$status"
              ;;
          esac

  lint:
    name: Express lint
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Attempt to update submodules (non-fatal)
        run: |
          git submodule update --init --recursive || true
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code

  test:
    name: Express tests Windows x64
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Attempt to update submodules (non-fatal)
        run: |
          git submodule update --init --recursive || true
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install --frozen-lockfile --production=false
          npx --no-install node-gyp rebuild
          yarn build
          yarn test
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: x64
          TARGET_ARCH: x64
      - name: Run unit tests
        run: yarn test:unit
        # script/test.mjs owns both the worker heap limit and the concurrency
        # budget. A workflow-level NODE_OPTIONS override is inherited by every
        # worker and makes the harness underestimate its peak memory use.
      - name: Run script tests
        run: yarn test:script

  release_notes:
    name: Release notes
    # Notes describe the commit, not a platform, so they are built off both
    # lanes. Leaving them inside the Windows job meant a red Windows lane took
    # the notes down with the installers and left nothing to publish at all.
    if: needs.prepare.outputs.proceed == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Attempt to update submodules (non-fatal)
        run: |
          git submodule update --init --recursive || true
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - run: mkdir -p release-payload
      - name: Generate bounded exact-SHA release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn --silent ts-node -P script/tsconfig.json \
            script/generate-automated-release-notes.ts \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --release-sha "$RELEASE_TARGET_SHA" \
            --output "release-payload/release-notes.md"
      # The shared instructions put the line count in the release rather than
      # only the README, and require CI to be what measures it: this runs over
      # the exact commit being released, in the same run that built the
      # artifacts, so no hand-typed number can drift from the tree.
      - name: Append the measured line count to the release notes
        shell: bash
        run: |
          {
            printf '\n## Lines of code\n\n'
            node script/count-lines.mjs
            printf '\nCounted by CI over \140%s\140 with \140node script/count-lines.mjs\140.\n' \
              "$RELEASE_TARGET_SHA"
          } >> release-payload/release-notes.md
      - name: Preserve exact release notes
        uses: actions/upload-artifact@v7
        with:
          name:
            express-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/release-notes.md
          if-no-files-found: error
          retention-days: 3

  tui_package:
    name: Linux TUI packages
    # Built only when the Linux lane vouched for it. A red Windows lane costs
    # this Release its installers, never its terminal edition.
    if:
      needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.linux_ok
      == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tui_version.outputs.version }}
      wheel_name: ${{ steps.tui_payload.outputs.wheel_name }}
      sdist_name: ${{ steps.tui_payload.outputs.sdist_name }}
      constraints_name: ${{ steps.tui_payload.outputs.constraints_name }}
      installer_name: ${{ steps.tui_payload.outputs.installer_name }}
      bootstrap_name: ${{ steps.tui_payload.outputs.bootstrap_name }}
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Require the prepared exact commit
        shell: bash
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match release target $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock
      - name: Install locked TUI environment
        working-directory: tui
        run: uv sync --locked --extra dev --python 3.12
      - name: Test fresh-Linux installer contract
        run: sh script/install-linux-tui-test.sh --unit
      - name: Discover exact TUI package version
        id: tui_version
        working-directory: tui
        shell: bash
        run: |
          version=$(uv run --python 3.12 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -z "$version" ] || [[ "$version" == *[[:space:]]* ]]; then
            echo "TUI pyproject.toml did not provide one usable package version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify generated parity contract
        run: node tui/tools/generate-parity-contract.mjs --check
      - name: Run TUI tests
        working-directory: tui
        run: uv run --python 3.12 pytest
      - name: Run TUI lint and types
        working-directory: tui
        run: |
          uv run --python 3.12 ruff check .
          uv run --python 3.12 mypy src
      - name: Build wheel and source distribution
        working-directory: tui
        run: uv build --clear
      - name: Export lock-derived runtime constraints
        working-directory: tui
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
        run: >-
          uv export --locked --no-dev --no-emit-project --no-hashes
          --output-file
          "dist/desktop_material_tui-${TUI_VERSION}-runtime-requirements.txt"
      - name: Verify and collect exact TUI payload
        id: tui_payload
        shell: bash
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
        run: |
          shopt -s nullglob
          wheels=(tui/dist/*.whl)
          sdists=(tui/dist/*.tar.gz)
          constraints=(tui/dist/*-runtime-requirements.txt)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ] || \
             [ "${#constraints[@]}" -ne 1 ]; then
            echo "Expected exactly one TUI wheel, source distribution, and constraints file." >&2
            printf 'wheel: %s\n' "${wheels[@]:-<none>}" >&2
            printf 'sdist: %s\n' "${sdists[@]:-<none>}" >&2
            printf 'constraints: %s\n' "${constraints[@]:-<none>}" >&2
            exit 1
          fi
          expected_wheel="desktop_material_tui-${TUI_VERSION}-py3-none-any.whl"
          expected_sdist="desktop_material_tui-${TUI_VERSION}.tar.gz"
          expected_constraints="desktop_material_tui-${TUI_VERSION}-runtime-requirements.txt"
          wheel_name=$(basename "${wheels[0]}")
          sdist_name=$(basename "${sdists[0]}")
          constraints_name=$(basename "${constraints[0]}")
          if [ "$wheel_name" != "$expected_wheel" ] || \
             [ "$sdist_name" != "$expected_sdist" ] || \
             [ "$constraints_name" != "$expected_constraints" ]; then
            echo "Built TUI package names do not match pyproject.toml version $TUI_VERSION." >&2
            printf 'Expected: %s, %s, and %s\n' \
              "$expected_wheel" "$expected_sdist" "$expected_constraints" >&2
            printf 'Actual:   %s, %s, and %s\n' \
              "$wheel_name" "$sdist_name" "$constraints_name" >&2
            exit 1
          fi
          installer_name=install-linux-tui.sh
          bootstrap_name=bootstrap-linux-tui.sh
          sh -n script/install-linux-tui.sh
          sh -n script/bootstrap-linux-tui.sh
          mkdir -p release-payload/tui
          cp "${wheels[0]}" "${sdists[0]}" "${constraints[0]}" \
            script/install-linux-tui.sh script/bootstrap-linux-tui.sh \
            release-payload/tui/
          chmod 0755 "release-payload/tui/$installer_name" \
            "release-payload/tui/$bootstrap_name"
          test -s "release-payload/tui/$wheel_name"
          test -s "release-payload/tui/$sdist_name"
          test -s "release-payload/tui/$constraints_name"
          test -x "release-payload/tui/$installer_name"
          test -x "release-payload/tui/$bootstrap_name"
          {
            echo "wheel_name=$wheel_name"
            echo "sdist_name=$sdist_name"
            echo "constraints_name=$constraints_name"
            echo "installer_name=$installer_name"
            echo "bootstrap_name=$bootstrap_name"
          } >> "$GITHUB_OUTPUT"
      - name: Smoke-test the fresh TUI wheel
        shell: bash
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
          TUI_WHEEL_NAME: ${{ steps.tui_payload.outputs.wheel_name }}
          TUI_CONSTRAINTS_NAME:
            ${{ steps.tui_payload.outputs.constraints_name }}
        run: |
          smoke="$RUNNER_TEMP/desktop-material-tui-release-smoke"
          uv venv "$smoke" --python 3.12 --clear
          UV_NO_CACHE=1 uv pip install \
            --python "$smoke/bin/python" \
            --constraint "release-payload/tui/$TUI_CONSTRAINTS_NAME" \
            "release-payload/tui/$TUI_WHEEL_NAME"
          installed=$("$smoke/bin/python" -c \
            'import importlib.metadata; print(importlib.metadata.version("desktop-material-tui"))')
          if [ "$installed" != "$TUI_VERSION" ]; then
            echo "Fresh wheel installed version $installed, expected $TUI_VERSION." >&2
            exit 1
          fi
          reported=$("$smoke/bin/desktop-material-tui" --version)
          if [ "$reported" != "desktop-material-tui $TUI_VERSION" ]; then
            echo "Fresh wheel entry point reported '$reported'." >&2
            exit 1
          fi
      - name: Exercise the one-shot installer in fresh Debian slim
        shell: bash
        env:
          TUI_WHEEL_NAME: ${{ steps.tui_payload.outputs.wheel_name }}
          TUI_CONSTRAINTS_NAME:
            ${{ steps.tui_payload.outputs.constraints_name }}
        run: >-
          sh script/install-linux-tui-test.sh --debian-container
          "release-payload/tui/$TUI_WHEEL_NAME"
          "release-payload/tui/$TUI_CONSTRAINTS_NAME"
      - name: Preserve verified TUI packages
        uses: actions/upload-artifact@v7
        with:
          name: express-tui-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/tui/
          if-no-files-found: error
          retention-days: 3

  package:
    name: Windows x64
    # The mirror of `tui_package`: a red Linux lane costs this Release its
    # terminal edition, never its installers.
    if:
      needs.prepare.outputs.proceed == 'true' &&
      needs.prepare.outputs.windows_ok == 'true'
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Attempt to update submodules (non-fatal)
        run: |
          git submodule update --init --recursive || true
      - name: Require the prepared exact commit
        shell: bash
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match release target $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - name: Apply prepared release version
        shell: bash
        run: |
          node -e "const f='./app/package.json';const p=require(f);p.version='$RELEASE_VERSION';require('fs').writeFileSync(f, JSON.stringify(p, null, 2) + '\n')"
      - name: Build production app
        run: yarn build:prod
        env:
          npm_config_arch: x64
          TARGET_ARCH: x64
      - uses: ./.github/actions/setup-windows-signing
        with:
          enabled: 'false'
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: x64
          TARGET_ARCH: x64
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-payload/installers
          shopt -s nullglob
          for f in \
            "dist/GitHub Desktop-x64.zip" \
            dist/GitHubDesktop-*.nupkg \
            "dist/GitHubDesktopSetup-x64.exe" \
            "dist/GitHubDesktopSetup-x64.msi"; do
            [ -e "$f" ] && cp "$f" release-payload/installers/
          done
          if [ -e dist/RELEASES ]; then
            # Squirrel installs the highest version the manifest names, so the
            # published feed must only ever name this package at this version.
            node script/release-version.js filter "$RELEASE_VERSION" \
              < dist/RELEASES > release-payload/installers/RELEASES
            while read -r _sha name _size || [[ -n "$name" ]]; do
              [ -z "$name" ] && continue
              [ -e "release-payload/installers/$name" ] && continue
              case "$name" in
                *-full.nupkg)
                  src=$(find dist -maxdepth 1 -type f -name '*-full.nupkg' -print | LC_ALL=C sort | sed -n '1p')
                  ;;
                *-delta.nupkg)
                  src=$(find dist -maxdepth 1 -type f -name '*-delta.nupkg' -print | LC_ALL=C sort | sed -n '1p')
                  ;;
                *) src="" ;;
              esac
              if [[ "$name" == *-full.nupkg || "$name" == *-delta.nupkg ]] && \
                 [ -z "$src" ]; then
                echo "RELEASES names $name, but no matching source package exists." >&2
                exit 1
              fi
              [ -n "$src" ] && cp "$src" "release-payload/installers/$name"
            done < release-payload/installers/RELEASES
          fi
          ls -la release-payload/installers
      - name: Verify required release assets
        shell: bash
        run: |
          required=(
            release-payload/installers/RELEASES
            "release-payload/installers/GitHub Desktop-x64.zip"
            release-payload/installers/GitHubDesktopSetup-x64.exe
            release-payload/installers/GitHubDesktopSetup-x64.msi
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-full.nupkg"
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"
          )
          for asset in "${required[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty required release asset: $asset" >&2
              exit 1
            fi
          done
      - name: Preserve express installer payload
        uses: actions/upload-artifact@v7
        with:
          name: express-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Preserve the upstream CI failure result
        if: needs.prepare.outputs.block_reason == 'ci-failed'
        shell: bash
        run: |
          echo "Installer recovery artifacts were preserved, but this run cannot publish because its upstream CI failed." >&2
          exit 1

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - lint
      - test
      - release_notes
      - tui_package
      - package
    # A packaging job that was skipped because its lane was red is not a
    # failure here — it is the whole point of splitting the lanes. What is
    # still refused: a job that ran and failed, and a Release with nothing in
    # it because neither lane produced anything.
    if: >-
      !cancelled() && always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.proceed == 'true' && needs.prepare.outputs.publish
      == 'true' && needs.release_notes.result == 'success' &&
      needs.package.result != 'failure' && needs.package.result != 'cancelled'
      && needs.tui_package.result != 'failure' && needs.tui_package.result !=
      'cancelled' && (needs.package.result == 'success' ||
      needs.tui_package.result == 'success') && (github.event_name ==
      'workflow_run' ||
       (needs.lint.result == 'success' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TUI_VERSION: ${{ needs.tui_package.outputs.version }}
      TUI_WHEEL_NAME: ${{ needs.tui_package.outputs.wheel_name }}
      TUI_SDIST_NAME: ${{ needs.tui_package.outputs.sdist_name }}
      TUI_CONSTRAINTS_NAME: ${{ needs.tui_package.outputs.constraints_name }}
      TUI_INSTALLER_NAME: ${{ needs.tui_package.outputs.installer_name }}
      TUI_BOOTSTRAP_NAME: ${{ needs.tui_package.outputs.bootstrap_name }}
      # RELEASE_TOKEN (a fine-grained PAT with Contents write on this repo)
      # takes precedence when configured: since 2026-07-26 the workflow token
      # is refused by POST /releases (issue #44), while a user PAT publishes
      # fine. An empty/absent secret falls back to the workflow token.
      GH_TOKEN:
        ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN
        }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-github-cli
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        if: needs.package.result == 'success'
        with:
          name: express-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/installers
      - uses: actions/download-artifact@v8
        with:
          name:
            express-release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload
      - uses: actions/download-artifact@v8
        if: needs.tui_package.result == 'success'
        with:
          name: express-tui-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/tui
      - name: Revalidate immutable release tag before publishing
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            0)
              echo "Release tag $tag appeared while building; refusing to update an existing release." >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Unable to prove release tag $tag is absent (git ls-remote exited $status)." >&2
              exit "$status"
              ;;
          esac
      - name: Verify downloaded release payload
        shell: bash
        env:
          HAVE_INSTALLERS: ${{ needs.package.result == 'success' }}
          HAVE_TUI: ${{ needs.tui_package.result == 'success' }}
        run: |
          # Each family is demanded in full or not at all. A lane that was red
          # contributes nothing and says so; a lane that was green may not
          # contribute a half-built payload.
          required=(release-payload/release-notes.md)
          if [ "$HAVE_INSTALLERS" = true ]; then
            required+=(
              release-payload/installers/RELEASES
              "release-payload/installers/GitHub Desktop-x64.zip"
              release-payload/installers/GitHubDesktopSetup-x64.exe
              release-payload/installers/GitHubDesktopSetup-x64.msi
              "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-full.nupkg"
              "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"
            )
          else
            echo "CI Windows did not pass; this Release ships without the desktop installers."
          fi
          if [ "$HAVE_TUI" = true ]; then
            required+=(
              "release-payload/tui/$TUI_WHEEL_NAME"
              "release-payload/tui/$TUI_SDIST_NAME"
              "release-payload/tui/$TUI_CONSTRAINTS_NAME"
              "release-payload/tui/$TUI_INSTALLER_NAME"
              "release-payload/tui/$TUI_BOOTSTRAP_NAME"
            )
          else
            echo "CI Linux did not pass; this Release ships without the terminal edition package."
          fi
          for asset in "${required[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty downloaded release payload: $asset" >&2
              exit 1
            fi
          done

          # Say in the Release itself which half is absent, so nobody reads a
          # missing download as a lost upload.
          if [ "$HAVE_INSTALLERS" != true ] || [ "$HAVE_TUI" != true ]; then
            {
              printf '\n## Partial release\n\n'
              [ "$HAVE_INSTALLERS" = true ] || \
                printf -- '- The Windows installers are absent: \140CI Windows\140 did not pass for this commit.\n'
              [ "$HAVE_TUI" = true ] || \
                printf -- '- The Linux terminal edition is absent: \140CI Linux\140 did not pass for this commit.\n'
              printf '\nThe other edition was built and verified from this exact commit.\n'
            } >> release-payload/release-notes.md
          fi
      - name: Publish GitHub release
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          assets=(release-payload/installers/* release-payload/tui/*)
          shopt -u nullglob
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Desktop Material $RELEASE_VERSION" \
            --notes-file release-payload/release-notes.md \
            --latest=false
          create_status=$?
          set -e
          if [ "$create_status" -ne 0 ]; then
            # 2026-07-26: the workflow token began receiving 403s from
            # POST /releases for non-prerelease creation while prerelease
            # creation kept succeeding (runs 30187367300, 30187848822).
            # Recover by creating the release as a prerelease, uploading the
            # same assets, then clearing the flag. If the final edit also
            # fails, the run fails loudly with the prerelease left intact.
            echo "Direct release creation failed with status $create_status;" \
              "falling back to prerelease-then-clear." >&2
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_TARGET_SHA" \
              -f name="Desktop Material $RELEASE_VERSION" \
              -F prerelease=true \
              -f make_latest=false \
              -F body=@release-payload/release-notes.md >/dev/null
            gh release upload "$RELEASE_TAG" \
              release-payload/installers/* release-payload/tui/* \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false --latest=false
          fi
      - name: Verify published release target
        shell: bash
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG"
          published=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$published" != "$RELEASE_TARGET_SHA" ]; then
            echo "Published tag resolves to $published, expected $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "Published release unexpectedly remained a draft." >&2
            exit 1
          fi
          published_assets=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for expected in "$TUI_WHEEL_NAME" "$TUI_SDIST_NAME" \
            "$TUI_CONSTRAINTS_NAME" "$TUI_INSTALLER_NAME" \
            "$TUI_BOOTSTRAP_NAME"; do
            if ! grep -Fqx "$expected" <<<"$published_assets"; then
              echo "Published release is missing TUI asset $expected." >&2
              exit 1
            fi
          done
      - name: Reconcile Latest to the newest main release
        shell: bash
        run: bash .github/scripts/promote-current-release.sh
