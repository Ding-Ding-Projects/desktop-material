# The Windows lane: the desktop application's build, unit and script tests,
# packaging, and installed-app smoke test, plus the terminal edition's Windows
# core check. It is deliberately a separate workflow from the Linux lane so
# that a red terminal test can never withhold the desktop installers, and a red
# desktop build can never withhold the terminal package. Both lanes feed the
# one Release; `build-installers.yml` waits for both to finish and publishes
# only when both tested payload families passed.
# Ordinary CI uses GitHub-hosted Windows runners so pushes, pull requests, and
# workflow calls get a clean, reproducible machine. A manual dispatch from the
# protected main branch may explicitly select the registered Windows
# self-hosted pool for desktop build and packaged smoke jobs when its warm
# dependency and compiler caches are faster; the Windows TUI core job remains
# hosted.
name: CI Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: Runner pool for the Windows desktop jobs
        required: true
        default: cloud
        type: choice
        options:
          - cloud
          - self-hosted
  workflow_call:
    inputs:
      repository:
        default: ''
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        default: ''
        required: false
      sign:
        type: boolean
        default: true
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:

# Validation is replaceable: a newer commit on the same ref cancels stale work.
# Release and publication workflows keep separate non-cancelling contracts.
concurrency:
  group:
    ci-windows-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.15.0
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  windows-tui-core:
    name: Windows TUI core · Python 3.12
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Enable Git long paths for Windows TUI tests
        run: git config core.longpaths true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock
      - name: Install managed Python 3.12
        run: uv python install 3.12
      - name: Install locked TUI environment
        working-directory: tui
        run: uv sync --locked --extra dev --python 3.12
      - name: Test non-PTY CLI, Cheap LFS, and core services
        working-directory: tui
        run: >-
          uv run --python 3.12 pytest tests/unit tests/application
          tests/infrastructure
      - name: Lint and type-check cross-platform core
        working-directory: tui
        run: |
          uv run ruff check src tests/unit tests/application tests/infrastructure
          uv run mypy src
  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on:
      ${{ github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main' && inputs.runner_mode == 'self-hosted' &&
      fromJSON('["self-hosted","Windows","X64","desktop-material-windows-local"]')
      || 'windows-2022' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            friendlyName: Windows
          - arch: arm64
            friendlyName: Windows
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: |
          # prefer the new official mirror for the lowlevel MCP submodule if present
          git config --local submodule.vendor/lowlevel-computer-use-mcp.url https://github.com/Ding-Ding-Projects/lowlevel-computer-use-mcp.git
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: ./.github/actions/setup-ci-environment
        id: setup_ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Run desktop-trampoline tests
        if: matrix.arch == 'x64'
        run: |
          cd vendor/desktop-trampoline
          yarn install --frozen-lockfile --production=false
          npx --no-install node-gyp rebuild
          yarn build
          yarn test
      - name: Build production app
        id: production_build
        if:
          ${{ always() && !cancelled() && steps.setup_ci.outcome == 'success' }}
        run: yarn build:prod
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Run unit tests
        if: matrix.arch == 'x64'
        run: yarn test:unit
        # script/test.mjs owns both the worker heap limit and the concurrency
        # budget. A workflow-level NODE_OPTIONS override is inherited by every
        # worker and makes the harness underestimate its peak memory use.
      - name: Run script tests
        if:
          ${{ always() && !cancelled() && steps.production_build.outcome ==
          'success' }}
        run: yarn test:script
      - uses: ./.github/actions/setup-windows-signing
        id: windows_signing
        if:
          ${{ always() && !cancelled() && steps.production_build.outcome ==
          'success' }}
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        id: installer_package
        if:
          ${{ always() && !cancelled() && steps.production_build.outcome ==
          'success' && steps.windows_signing.outcome == 'success' }}
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        # Preserve a usable installer even when a test step fails. The job
        # still reports the original test failure; this only keeps its build
        # output available for diagnosis and recovery.
        if:
          ${{ always() && !cancelled() && steps.installer_package.outcome ==
          'success' && (github.event_name != 'workflow_call' ||
          inputs.upload-artifacts) }}
        with:
          name: ${{matrix.friendlyName}}-${{matrix.arch}}
          path: |
            dist/GitHub Desktop-${{matrix.arch}}.zip
            dist/GitHubDesktop-*.nupkg
            dist/GitHubDesktopSetup-${{matrix.arch}}.exe
            dist/GitHubDesktopSetup-${{matrix.arch}}.msi
            dist/bundle-size.json
            dist/bundle-hash.json
          if-no-files-found: error
  e2e-smoke:
    name: E2E Smoke ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on:
      ${{ github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main' && inputs.runner_mode == 'self-hosted' &&
      fromJSON('["self-hosted","Windows","X64","desktop-material-windows-local"]')
      || 'windows-2022' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - friendlyName: Windows
            arch: x64
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: |
          # prefer the new official mirror for the lowlevel MCP submodule if present
          git config --local submodule.vendor/lowlevel-computer-use-mcp.url https://github.com/Ding-Ding-Projects/lowlevel-computer-use-mcp.git
          git submodule sync --recursive
          git submodule update --init --recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Select mock update server port
        uses: ./.github/actions/setup-e2e-update-port
      - name: Build production app
        run: yarn build:prod
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Install app on Windows
        run: |
          function Write-SquirrelLogs {
            $logPaths = @(
              "$env:LOCALAPPDATA\SquirrelSetup.log",
              "$env:LOCALAPPDATA\GitHubDesktop\SquirrelSetup.log"
            )

            foreach ($logPath in $logPaths) {
              if (Test-Path $logPath) {
                Write-Host "Showing log: $logPath"
                Get-Content $logPath -Tail 200
              }
            }
          }

          $setupExe = "dist/GitHubDesktopSetup-${{ matrix.arch }}.exe"
          if (-not (Test-Path -LiteralPath $setupExe)) {
            throw "Windows installer was not built: $setupExe"
          }
          $expectedVersion = (Get-Content -LiteralPath 'app/package.json' -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw 'app/package.json did not provide an installable application version'
          }
          $installStartedAt = [DateTime]::UtcNow
          $preexistingDesktopProcessIds = @(
            Get-Process GitHubDesktop -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Id
          )
          $installer = Start-Process -FilePath $setupExe -ArgumentList "/S" -PassThru
          $installerSessionId = $installer.SessionId
          function Stop-InstallerLaunchedDesktopProcesses {
            Get-Process GitHubDesktop -ErrorAction SilentlyContinue |
              Where-Object {
                $_.SessionId -eq $installerSessionId -and
                $preexistingDesktopProcessIds -notcontains $_.Id
              } |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
          # Start-Process -Wait includes the descendant application process
          # that Squirrel launches, so it cannot return before the workflow's
          # later GitHubDesktop cleanup. Wait only for the installer process.
          if (-not $installer.WaitForExit(300000)) {
            Write-SquirrelLogs
            taskkill.exe /PID $installer.Id /T /F 2>$null
            throw "Windows installer timed out after 300 seconds"
          }
          if ($installer.ExitCode -ne 0) {
            Write-SquirrelLogs
            throw "Windows installer exited with code $($installer.ExitCode)"
          }

          Stop-InstallerLaunchedDesktopProcesses

          $installedExe = $null
          for ($attempt = 0; $attempt -lt 30 -and -not $installedExe; $attempt++) {
            # Squirrel can launch the application just after Setup.exe exits.
            # Repeat the scoped cleanup while the fresh executable appears.
            Stop-InstallerLaunchedDesktopProcesses
            $candidate = Get-Item (Join-Path $env:LOCALAPPDATA "GitHubDesktop\app-$expectedVersion\GitHubDesktop.exe") -ErrorAction SilentlyContinue
            if ($candidate -and $candidate.LastWriteTimeUtc -ge $installStartedAt) {
              $installedExe = $candidate.FullName
            }

            if (-not $installedExe) {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $installedExe) {
            Write-SquirrelLogs
            throw "Unable to verify the freshly installed GitHub Desktop executable for version $expectedVersion"
          }

          Start-Sleep -Seconds 2
          Stop-InstallerLaunchedDesktopProcesses

          Add-Content -Path $env:GITHUB_ENV -Value "DESKTOP_E2E_APP_PATH=$installedExe"
      - name: Run packaged E2E smoke tests
        run: yarn test:e2e:run:packaged
      - name: Upload E2E artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{matrix.friendlyName}}-${{matrix.arch}}
          path: playwright-videos/**
          if-no-files-found: warn
