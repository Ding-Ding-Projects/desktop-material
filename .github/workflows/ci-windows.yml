# Windows build and package lane. Code-quality checks run locally in the task
# that changes the source; GitHub Actions builds deliverables and preserves
# bounded evidence without running tests, lint, type checks, static analysis,
# coverage, or screenshot verification.
name: CI Windows

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: Runner pool for the Windows desktop jobs
        required: true
        default: cloud
        type: choice
        options:
          - cloud
          - self-hosted
  workflow_call:
    inputs:
      repository:
        default: ''
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        default: ''
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false

concurrency:
  group:
    ci-windows-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref
    }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') &&
    github.run_id || 'shared' }}
  cancel-in-progress:
    ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  NODE_VERSION: 24.15.0
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  build:
    name: Build and package Windows ${{ matrix.arch }}
    runs-on:
      ${{ github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main' && inputs.runner_mode == 'self-hosted' &&
      fromJSON('["self-hosted","Windows","X64","desktop-material-windows-local"]')
      || 'windows-2022' }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - name: Initial checkout for Windows bootstrap
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Bootstrap Git and Bash for self-hosted Windows
        if: runner.environment == 'self-hosted'
        shell: cmd
        run: "%GITHUB_WORKSPACE%\\.github\\scripts\\ensure-windows-git-bash.cmd"

      - name: Repeat checkout with bootstrapped Git
        if: runner.environment == 'self-hosted'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: |
          git config --local submodule.vendor/lowlevel-computer-use-mcp.url https://github.com/Ding-Ding-Projects/lowlevel-computer-use-mcp.git
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: ./.github/actions/setup-ci-environment
        id: setup_ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}

      - name: Build production app
        id: production_build
        if:
          ${{ always() && !cancelled() && steps.setup_ci.outcome == 'success' }}
        run: yarn build:prod
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Package production app
        id: installer_package
        if:
          ${{ always() && !cancelled() && steps.production_build.outcome ==
          'success' }}
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
          WINDOWS_SIGNING_ENABLED: 'false'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
          AZURE_TENANT_ID: ''
          AZURE_CLIENT_ID: ''

      - name: Require unsigned packaged installers
        id: unsigned_installers
        if:
          ${{ always() && !cancelled() && steps.installer_package.outcome ==
          'success' }}
        run: |
          $installers = @(
            "dist\GitHubDesktopSetup-${{ matrix.arch }}.exe",
            "dist\GitHubDesktopSetup-${{ matrix.arch }}.msi"
          )
          foreach ($installer in $installers) {
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "Unsigned installer is missing: $installer"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Installer must remain unsigned: ${installer} reported $($signature.Status)"
            }
          }

      - name: Upload packaged desktop artifacts
        if:
          ${{ always() && !cancelled() && steps.installer_package.outcome ==
          'success' && steps.unsigned_installers.outcome == 'success' &&
          (github.event_name != 'workflow_call' || inputs.upload-artifacts) }}
        uses: actions/upload-artifact@v7
        with:
          name: Windows-${{ matrix.arch }}
          path: |
            dist/GitHub Desktop-${{ matrix.arch }}.zip
            dist/GitHubDesktop-*.nupkg
            dist/GitHubDesktopSetup-${{ matrix.arch }}.exe
            dist/GitHubDesktopSetup-${{ matrix.arch }}.msi
            dist/RELEASES
            dist/bundle-size.json
            dist/bundle-hash.json
          if-no-files-found: error
          retention-days: 7

      - name: Collect bounded build evidence
        if: ${{ always() }}
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path workflow-evidence | Out-Null
          [ordered]@{
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            commit = '${{ github.sha }}'
            architecture = '${{ matrix.arch }}'
            runnerOS = '${{ runner.os }}'
            runnerArchitecture = '${{ runner.arch }}'
            buildOutcome = '${{ steps.production_build.outcome }}'
            packageOutcome = '${{ steps.installer_package.outcome }}'
            unsignedOutcome = '${{ steps.unsigned_installers.outcome }}'
          } | ConvertTo-Json | Set-Content -LiteralPath workflow-evidence/context.json
          foreach ($path in @('dist/bundle-size.json', 'dist/bundle-hash.json', 'dist/RELEASES')) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              Copy-Item -LiteralPath $path -Destination workflow-evidence
            }
          }

      - name: Upload bounded build evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name:
            windows-build-evidence-${{ matrix.arch }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: workflow-evidence/
          if-no-files-found: warn
          retention-days: 7
