# The Linux lane: static checks, supply-chain review, and the terminal
# edition's test matrix. It is deliberately a separate workflow from the
# Windows lane so that a red terminal test can never withhold the desktop
# installers, and a red desktop build can never withhold the terminal package.
# Both lanes feed the one Release; `build-installers.yml` waits for both to
# finish and then ships whatever each lane vouched for. Ordinary CI uses
# GitHub-hosted Linux runners so every event gets a clean, reproducible machine.
name: CI Linux

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        default: ''
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        default: ''
        required: false
      sign:
        type: boolean
        default: true
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:

# Every run gets its own group. CI is a release gate, so a newer commit must not
# silently cancel an older commit's chance to finish and publish its result.
concurrency:
  group: ci-linux-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Attempt to update submodules (non-fatal)
        run: |
          # prefer the new official mirror for the lowlevel MCP submodule if present
          git config --local submodule.vendor/lowlevel-computer-use-mcp.url https://github.com/Ding-Ding-Projects/lowlevel-computer-use-mcp.git || true
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      # --frozen-lockfile turns a lock file that no longer matches the manifests
      # into an immediate, named failure instead of a silent re-resolution that
      # only the working-directory check at the end of this job would catch.
      # Lint is static and must not rebuild Electron-targeted native modules:
      # doing so adds an unrelated remote header download and native toolchain
      # failure boundary to a job that never loads those binaries.
      - run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      # No install: the provenance check reads the lock files, and `yarn audit`
      # builds its tree from yarn.lock plus the in-repo `file:` dependency
      # directories under vendor/, none of which are submodules.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify lock file provenance and integrity
        run: |
          set -uo pipefail
          # This check is offline and deterministic — it only reads files that
          # are already in the commit — which is why it is allowed to fail the
          # build. An entry that suddenly resolves from another host, or that
          # lost its subresource hash, means the lock file no longer pins what
          # it claims to.
          #
          # Entries without a `resolved` line (the `file:` resolutions pointing
          # at vendor/) are reviewed as repository code and skipped.
          # vendor/desktop-trampoline/yarn.lock is upstream's own file and is
          # not audited here; three of its entries predate `integrity`.
          status=0
          for lock in yarn.lock app/yarn.lock; do
            echo "Checking $(grep -c '^  resolved ' "$lock") resolved packages in $lock"
            awk -v lock="$lock" '
              function flush() {
                if (resolved != "" && integrity == "") {
                  printf "%s: %s is resolved without an integrity hash\n", lock, entry
                  bad = 1
                }
                resolved = ""
                integrity = ""
              }
              /^[^ \t#]/ { flush(); entry = $0; next }
              /^  resolved / {
                resolved = $2
                gsub(/"/, "", resolved)
                host = resolved
                sub(/^https?:\/\//, "", host)
                sub(/\/.*$/, "", host)
                if (host != "registry.yarnpkg.com" && host != "registry.npmjs.org") {
                  printf "%s: %s resolves from unexpected host %s\n", lock, entry, host
                  bad = 1
                }
                next
              }
              /^  integrity / { integrity = $2; next }
              END { flush(); exit (bad ? 1 : 0) }
            ' "$lock" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error title=Lock file provenance::A lock file entry resolves from an unexpected host or carries no integrity hash. Review the diff to yarn.lock before merging."
            exit 1
          fi
      - name: Report dependency advisories
        run: |
          set -uo pipefail
          # `yarn audit` exits with a bitfield of the severities it found, so
          # gating on it would turn every commit red for a transitive advisory
          # with no published fix — a state no commit in this repository can
          # repair. Advisories are therefore surfaced in the job summary and as
          # warning annotations, and this step always succeeds.
          set +e
          audited=0
          for target in . app; do
            label=root
            if [ "$target" != "." ]; then
              label="$target"
            fi
            out="$RUNNER_TEMP/yarn-audit-$label.txt"
            # --no-color keeps ANSI escapes out of the job summary's code block.
            (cd "$target" && yarn audit --no-progress --no-color) >"$out" 2>&1
            code=$?
            {
              echo "### Dependency advisories — \`$label\`"
              echo
            } >>"$GITHUB_STEP_SUMMARY"
            if ! grep -q 'Packages audited' "$out"; then
              echo "::warning title=Dependency audit unavailable ($label)::yarn audit did not complete (exit $code); advisories were not evaluated for this manifest."
              {
                echo "> [!WARNING]"
                echo "> \`yarn audit\` did not complete (exit \`$code\`)."
                echo "> Advisories were **not** evaluated for this manifest."
                echo
              } >>"$GITHUB_STEP_SUMMARY"
            else
              audited=$((audited + 1))
              found=$(grep -E 'vulnerabilities found|^Severity:' "$out" | tr '\n' ' ')
              if [ "$code" -eq 0 ]; then
                echo "$found" >>"$GITHUB_STEP_SUMMARY"
              else
                echo "::warning title=Dependency advisories ($label)::$found See the job summary for the full report."
                {
                  echo "$found"
                  echo
                  echo "\`yarn audit\` exit code \`$code\` is a severity bitfield"
                  echo "(1 info, 2 low, 4 moderate, 8 high, 16 critical), not a"
                  echo "build failure."
                  echo
                } >>"$GITHUB_STEP_SUMMARY"
              fi
            fi
            {
              echo '<details><summary>Full report</summary>'
              echo
              echo '```text'
              # `head -c` can cut mid-line, so force a newline before the
              # closing fence; otherwise it lands inside the last line and the
              # code block never closes, swallowing the rest of the summary.
              head -c 60000 "$out"
              echo
              echo '```'
              echo
              echo '</details>'
              echo
            } >>"$GITHUB_STEP_SUMMARY"
          done
          if [ "$audited" -eq 0 ]; then
            echo "::warning title=Dependency audit unavailable::No manifest could be audited in this run; treat this run as carrying no advisory evidence."
          fi
          exit 0
  linux-tui:
    name: Linux TUI · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock
      - name: Install locked TUI environment
        working-directory: tui
        run:
          uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Test fresh-Linux installer contract
        if: matrix.python-version == '3.12'
        run: sh script/install-linux-tui-test.sh --unit
      - name: Verify generated parity contract
        run: node tui/tools/generate-parity-contract.mjs --check
      - name: Verify generated TUI changelog catalog
        run: node tui/tools/generate-tui-changelog-catalog.mjs --check
      - name: Run TUI tests
        working-directory: tui
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            uv run --python "${{ matrix.python-version }}" python tools/run-tests-isolated.py
          else
            uv run --python "${{ matrix.python-version }}" pytest
          fi
      - name: Run TUI lint and types
        if: matrix.python-version == '3.12'
        working-directory: tui
        run: |
          uv run ruff check .
          uv run mypy src
      - name: Build wheel and source distribution
        if: matrix.python-version == '3.12'
        working-directory: tui
        run: |
          uv build --clear
          version=$(uv run --python 3.12 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv export --locked --no-dev --no-emit-project --no-hashes \
            --output-file "dist/desktop_material_tui-${version}-runtime-requirements.txt"
          cp ../script/install-linux-tui.sh dist/install-linux-tui.sh
          cp ../script/bootstrap-linux-tui.sh dist/bootstrap-linux-tui.sh
          chmod 0755 dist/install-linux-tui.sh dist/bootstrap-linux-tui.sh
      - name: Smoke-test the built wheel
        if: matrix.python-version == '3.12'
        run: |
          wheel="$(find tui/dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          constraints="$(find tui/dist -maxdepth 1 -type f -name \
            'desktop_material_tui-*-runtime-requirements.txt' -print -quit)"
          test -n "$wheel"
          test -n "$constraints"
          uv venv "$RUNNER_TEMP/desktop-material-tui-smoke" --python 3.12
          uv pip install \
            --python "$RUNNER_TEMP/desktop-material-tui-smoke/bin/python" \
            --constraint "$constraints" \
            "$wheel"
          "$RUNNER_TEMP/desktop-material-tui-smoke/bin/desktop-material-tui" \
            --version
      - name: Exercise the one-shot installer in fresh Debian slim
        if: matrix.python-version == '3.12'
        run: |
          wheel="$(find tui/dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          constraints="$(find tui/dist -maxdepth 1 -type f -name \
            'desktop_material_tui-*-runtime-requirements.txt' -print -quit)"
          sh script/install-linux-tui-test.sh --debian-container \
            "$wheel" "$constraints"
      - name: Upload Linux TUI packages
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-material-tui-python
          path: tui/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Build and smoke-test the Linux TUI container
        if: matrix.python-version == '3.12'
        env:
          IMAGE_NAME: desktop-material-tui:ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker build --check --file tui/Dockerfile tui
          docker build --file tui/Dockerfile --tag "$IMAGE_NAME" tui
          trap 'docker image rm --force "$IMAGE_NAME" >/dev/null 2>&1 || true' EXIT

          expected=$(cd tui && uv run --python 3.12 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          reported=$(docker run --rm "$IMAGE_NAME" --version)
          if [ "$reported" != "desktop-material-tui $expected" ]; then
            echo "Container entry point reported '$reported', expected version $expected." >&2
            exit 1
          fi

          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_NAME")" = dmt
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$IMAGE_NAME")" \
            = '["desktop-material-tui"]'
