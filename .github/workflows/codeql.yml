name: 'Code scanning - action'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'

jobs:
  CodeQL-Build:
    # The Linux runner is scanning infrastructure, not a supported app target.
    # Desktop Material's runtime, package, and release support is Windows-only.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          config-file: ./.github/codeql/codeql-config.yml
          # Pinned: language auto-detection started scheduling a cpp analysis
          # when shell-extension/src/dllmain.cpp landed, and the Windows COM
          # stub cannot be autobuilt on this Linux runner. The product code is
          # TypeScript/JavaScript; the stub is compiled and validated by its
          # own test-backed MSVC pipeline instead.
          languages: javascript-typescript
      # Autobuild attempts to build any compiled languages (C/C++, C#, or Java).
      # If this step fails, then you should remove it and run the build manually (see below).
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.6

      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 https://git.io/JvXDl

      # ✏️ If the Autobuild fails above, remove it and uncomment the following
      #    three lines and modify them (or add more) to build your code if your
      #    project uses a compiled language

      #- run: |
      #     make bootstrap
      #     make release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
