name: Super Express Release

# Manual emergency lane. It deliberately runs no tests, lint, type checks,
# parity checks, or smoke tests. The ordinary CI and Express Release workflows
# remain the tested release paths. Every job in this emergency lane runs on a
# GitHub-hosted runner: the Windows package uses windows-2022 and the publisher
# uses ubuntu-latest. This lane publishes the Windows desktop payload only; the
# terminal edition remains available through its separate manual workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built packages as a GitHub Release
        required: true
        default: true
        type: boolean

# Publication has side effects, so a later dispatch must wait instead of
# cancelling an in-flight tag or upload sequence.
concurrency:
  group: super-express-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.15.0

jobs:
  prepare:
    name: Prepare exact release target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      RELEASE_TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Require a main-branch manual dispatch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Super Express Release must be dispatched from main." >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TARGET_SHA }}
          fetch-depth: 0

      - name: Require the exact dispatched commit
        shell: bash
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match $RELEASE_TARGET_SHA." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create a cross-lane monotonic package version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./app/package.json').version")
          version=$(node script/release-version.js create "$base" "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.run_number }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require an unused immutable tag
        id: target
        shell: bash
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            2) ;;
            0)
              echo "Release tag $RELEASE_TAG already exists; refusing to replace it." >&2
              exit 1
              ;;
            *)
              echo "Unable to prove $RELEASE_TAG is unused (status $status)." >&2
              exit "$status"
              ;;
          esac
          echo "sha=$RELEASE_TARGET_SHA" >> "$GITHUB_OUTPUT"

  windows_build:
    name: Build Windows x64 package
    needs: prepare
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    runs-on: windows-2022
    steps:
      - name: Initial checkout for Windows bootstrap
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Bootstrap Git and Bash for self-hosted Windows
        shell: cmd
        run: "%GITHUB_WORKSPACE%\\.github\\scripts\\ensure-windows-git-bash.cmd"
      - name: Repeat checkout with bootstrapped Git
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: |
          # prefer the new official mirror for the lowlevel MCP submodule if present
          git config --local submodule.vendor/lowlevel-computer-use-mcp.url https://github.com/Ding-Ding-Projects/lowlevel-computer-use-mcp.git
          git submodule sync --recursive
          git submodule update --init --recursive

      - id: package
        uses: ./.github/actions/super-express-windows-build
        with:
          release_target_sha: ${{ needs.prepare.outputs.sha }}
          release_version: ${{ needs.prepare.outputs.version }}
          node_version: ${{ env.NODE_VERSION }}
        env:
          DESKTOP_ERROR_REPORTING_ENDPOINT:
            ${{ secrets.DESKTOP_ERROR_REPORTING_ENDPOINT }}
          DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
            ${{ secrets.DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT }}

  prepare_publication:
    name: Prepare Windows GitHub Release payload
    needs:
      - prepare
      - windows_build
    if: >-
      !cancelled() && always() && needs.prepare.result == 'success' &&
      needs.windows_build.result == 'success' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.windows_build.outputs.artifact_name }}
          path: release-payload/installers

      - name: Verify downloaded release payload
        shell: bash
        run: |
          required=(
            release-payload/installers/RELEASES
            "release-payload/installers/GitHub Desktop-x64.zip"
            release-payload/installers/GitHubDesktopSetup-x64.exe
            release-payload/installers/GitHubDesktopSetup-x64.msi
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-full.nupkg"
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"
          )
          for asset in "${required[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty downloaded release asset: $asset" >&2
              exit 1
            fi
          done

      - name: Write fast local commit note
        shell: bash
        run: |
          {
            echo "Super Express package for commit \`$RELEASE_TARGET_SHA\`."
            echo
            echo 'Windows x64 desktop packages were built by the emergency lane.'
            echo 'The Windows setup executable and MSI are permanently unsigned and may trigger an unknown-publisher or SmartScreen warning.'
            echo 'This emergency lane deliberately runs no test or lint gates.'
            echo
            echo '### Commit'
            echo
            git show --no-patch --format='%s%n%n%b' "$RELEASE_TARGET_SHA" | \
              sed 's/^/    /'
            echo
            echo '## Lines of code'
            echo
            node script/count-lines.mjs
            echo
            echo "Counted by CI over \`$RELEASE_TARGET_SHA\` with \`node script/count-lines.mjs\`."
          } > release-payload/release-notes.md

      - name: Preserve Windows payload and notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: super-express-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish Windows GitHub Release
    needs:
      - prepare
      - prepare_publication
    if: >-
      !cancelled() && always() && needs.prepare.result == 'success' &&
      needs.prepare_publication.result == 'success' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-github-cli

      - uses: actions/download-artifact@v8
        with:
          name: super-express-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN:
            ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN ||
            secrets.GITHUB_TOKEN }}
        run: |
          set +e
          shopt -s nullglob
          assets=(release-payload/installers/*)
          shopt -u nullglob
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Desktop Material $RELEASE_VERSION" \
            --notes-file release-payload/release-notes.md \
            --latest=false
          create_status=$?
          set -e
          if [ "$create_status" -ne 0 ]; then
            # 2026-07-26: the workflow token began receiving 403s from
            # POST /releases for non-prerelease creation while prerelease
            # creation kept succeeding. Recover without replacing the tag.
            echo "Direct release creation failed with status $create_status;" \
              "falling back to prerelease-then-clear." >&2
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_TARGET_SHA" \
              -f name="Desktop Material $RELEASE_VERSION" \
              -F prerelease=true \
              -f make_latest=false \
              -F body=@release-payload/release-notes.md >/dev/null
            gh release upload "$RELEASE_TAG" \
              "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false --latest=false
          fi
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft \
            > release-payload/published-is-draft.txt
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            > release-payload/published-assets.txt

      - name: Verify published release target and assets
        shell: bash
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG"
          published=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$published" != "$RELEASE_TARGET_SHA" ]; then
            echo "Published tag resolves to $published, expected $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
          if [ "$(cat release-payload/published-is-draft.txt)" != "false" ]; then
            echo "Published release unexpectedly remained a draft." >&2
            exit 1
          fi
          published_assets=$(cat release-payload/published-assets.txt)
          # GitHub's release asset API normalizes spaces in this filename.
          for expected in \
            'RELEASES' \
            'GitHub.Desktop-x64.zip' \
            'GitHubDesktopSetup-x64.exe' \
            'GitHubDesktopSetup-x64.msi' \
            "GitHubDesktop-${RELEASE_VERSION}-full.nupkg" \
            "GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"; do
            if ! grep -Fqx "$expected" <<<"$published_assets"; then
              echo "Published release is missing asset $expected." >&2
              exit 1
            fi
          done

      - name: Reconcile Latest to the newest main release
        shell: bash
        env:
          GH_TOKEN:
            ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN ||
            secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/promote-current-release.sh
