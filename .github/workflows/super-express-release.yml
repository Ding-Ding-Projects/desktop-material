name: Super Express Release

# Manual emergency lane. It deliberately runs no tests, lint, type checks,
# parity checks, or smoke tests. The ordinary CI and Express Release workflows
# remain the tested release paths. Every job in this emergency lane runs on a
# registered self-hosted runner: Linux jobs use the WSL runner and the Windows
# package uses the native Windows runner. The Windows and Linux TUI build jobs
# run in parallel, then one Linux self-hosted publisher creates the combined
# Release so the Squirrel update feed and the TUI bootstrap URL still point at
# one payload.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built packages as a GitHub Release
        required: true
        default: true
        type: boolean

# Super Express is the one release lane allowed to supersede an older run.
# Its self-hosted pool is scarce, so a newer dispatch for the same ref cancels
# the stale release instead of leaving it consuming a local runner indefinitely.
concurrency:
  group: super-express-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: 24.15.0

jobs:
  prepare:
    name: Prepare exact release target
    runs-on:
      - self-hosted
      - Linux
      - X64
      - desktop-material-wsl-local
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      RELEASE_TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Require a main-branch manual dispatch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Super Express Release must be dispatched from main." >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TARGET_SHA }}
          fetch-depth: 0

      - name: Require the exact dispatched commit
        shell: bash
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match $RELEASE_TARGET_SHA." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create a cross-lane monotonic package version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./app/package.json').version")
          version=$(node script/release-version.js create "$base" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require an unused immutable tag
        id: target
        shell: bash
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            2) ;;
            0)
              echo "Release tag $RELEASE_TAG already exists; refusing to replace it." >&2
              exit 1
              ;;
            *)
              echo "Unable to prove $RELEASE_TAG is unused (status $status)." >&2
              exit "$status"
              ;;
          esac
          echo "sha=$RELEASE_TARGET_SHA" >> "$GITHUB_OUTPUT"

  windows_build:
    name: Build Windows x64 package (self-hosted)
    needs: prepare
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - desktop-material-windows-local
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Attempt to update submodules (non-fatal)
        continue-on-error: true
        run: |
          # prefer the new official mirror for the lowlevel MCP submodule if present
          git config --local submodule.vendor/lowlevel-computer-use-mcp.url https://github.com/Ding-Ding-Projects/lowlevel-computer-use-mcp.git
          git submodule sync --recursive
          git submodule update --init --recursive

      - id: package
        uses: ./.github/actions/super-express-windows-build
        with:
          release_target_sha: ${{ needs.prepare.outputs.sha }}
          release_version: ${{ needs.prepare.outputs.version }}
          node_version: ${{ env.NODE_VERSION }}
        env:
          DESKTOP_ERROR_REPORTING_ENDPOINT:
            ${{ secrets.DESKTOP_ERROR_REPORTING_ENDPOINT }}
          DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
            ${{ secrets.DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT }}

  tui_build:
    name: Build Linux TUI packages (self-hosted)
    needs: prepare
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - desktop-material-wsl-local
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - id: package
        uses: ./.github/actions/super-express-linux-tui-build
        with:
          release_target_sha: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish combined GitHub Release
    needs:
      - prepare
      - windows_build
      - tui_build
    if: >-
      !cancelled() && always() && needs.prepare.result == 'success' &&
      needs.windows_build.result == 'success' && needs.tui_build.result ==
      'success' && inputs.publish
    runs-on:
      - self-hosted
      - Linux
      - X64
      - desktop-material-wsl-local
    permissions:
      contents: write
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN:
        ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN
        }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-github-cli

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock

      - name: Install managed Python 3.12
        shell: bash
        run: uv python install 3.12

      - name: Discover exact TUI package version
        id: tui_version
        working-directory: tui
        shell: bash
        run: |
          version=$(uv run --python 3.12 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -z "$version" ] || [[ "$version" == *[[:space:]]* ]]; then
            echo "TUI pyproject.toml did not provide one usable package version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.windows_build.outputs.artifact_name }}
          path: release-payload/installers

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.tui_build.outputs.artifact_name }}
          path: release-payload/tui

      - name: Restore executable bits on downloaded TUI scripts
        shell: bash
        run:
          chmod 0755 release-payload/tui/install-linux-tui.sh
          release-payload/tui/bootstrap-linux-tui.sh

      - name: Verify downloaded release payload
        shell: bash
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
        run: |
          required=(
            release-payload/installers/RELEASES
            "release-payload/installers/GitHub Desktop-x64.zip"
            release-payload/installers/GitHubDesktopSetup-x64.exe
            release-payload/installers/GitHubDesktopSetup-x64.msi
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-full.nupkg"
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"
            "release-payload/tui/desktop_material_tui-${TUI_VERSION}-py3-none-any.whl"
            "release-payload/tui/desktop_material_tui-${TUI_VERSION}.tar.gz"
            "release-payload/tui/desktop_material_tui-${TUI_VERSION}-runtime-requirements.txt"
            release-payload/tui/install-linux-tui.sh
            release-payload/tui/bootstrap-linux-tui.sh
          )
          for asset in "${required[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty downloaded release asset: $asset" >&2
              exit 1
            fi
          done
          test -x release-payload/tui/install-linux-tui.sh
          test -x release-payload/tui/bootstrap-linux-tui.sh

      - name: Write fast local commit note
        shell: bash
        run: |
          {
            echo "Super Express package for commit \`$RELEASE_TARGET_SHA\`."
            echo
            echo 'Windows x64 and Linux TUI packages were built in parallel.'
            echo 'This emergency lane deliberately runs no test or lint gates.'
            echo
            echo '### Commit'
            echo
            git show --no-patch --format='%s%n%n%b' "$RELEASE_TARGET_SHA" | \
              sed 's/^/    /'
            echo
            echo '## Lines of code'
            echo
            node script/count-lines.mjs
            echo
            echo "Counted by CI over \`$RELEASE_TARGET_SHA\` with \`node script/count-lines.mjs\`."
          } > release-payload/release-notes.md

      - name: Preserve combined payload and notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: super-express-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          assets=(release-payload/installers/* release-payload/tui/*)
          shopt -u nullglob
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Desktop Material $RELEASE_VERSION" \
            --notes-file release-payload/release-notes.md \
            --latest
          create_status=$?
          set -e
          if [ "$create_status" -ne 0 ]; then
            # 2026-07-26: the workflow token began receiving 403s from
            # POST /releases for non-prerelease creation while prerelease
            # creation kept succeeding. Recover without replacing the tag.
            echo "Direct release creation failed with status $create_status;" \
              "falling back to prerelease-then-clear." >&2
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_TARGET_SHA" \
              -f name="Desktop Material $RELEASE_VERSION" \
              -F prerelease=true \
              -f make_latest=false \
              -F body=@release-payload/release-notes.md >/dev/null
            gh release upload "$RELEASE_TAG" \
              "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false --latest
          fi

      - name: Verify published release target and assets
        shell: bash
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG"
          published=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$published" != "$RELEASE_TARGET_SHA" ]; then
            echo "Published tag resolves to $published, expected $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "Published release unexpectedly remained a draft." >&2
            exit 1
          fi
          published_assets=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for expected in \
            'RELEASES' \
            'GitHub Desktop-x64.zip' \
            'GitHubDesktopSetup-x64.exe' \
            'GitHubDesktopSetup-x64.msi' \
            "GitHubDesktop-${RELEASE_VERSION}-full.nupkg" \
            "GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg" \
            "desktop_material_tui-${TUI_VERSION}-py3-none-any.whl" \
            "desktop_material_tui-${TUI_VERSION}.tar.gz" \
            "desktop_material_tui-${TUI_VERSION}-runtime-requirements.txt" \
            'install-linux-tui.sh' \
            'bootstrap-linux-tui.sh'; do
            if ! grep -Fqx "$expected" <<<"$published_assets"; then
              echo "Published release is missing asset $expected." >&2
              exit 1
            fi
          done

      - name: Reconcile Latest to the newest main release
        shell: bash
        run: bash .github/scripts/promote-current-release.sh
