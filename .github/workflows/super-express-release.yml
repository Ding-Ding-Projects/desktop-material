name: Super Express Release

# Manual emergency lane. It deliberately runs no tests, lint, type checks,
# parity checks, or smoke tests. The ordinary CI and Express Release workflows
# remain the tested release paths. The Windows and Linux TUI build workflows
# run in parallel, then one publisher creates the combined Release so the
# Squirrel update feed and the TUI bootstrap URL still point at one payload.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built packages as a GitHub Release
        required: true
        default: true
        type: boolean

# Do not add a shared concurrency group: overlapping manual releases must be
# allowed to finish independently.
permissions:
  contents: write

env:
  NODE_VERSION: 24.15.0

jobs:
  runner_selection:
    name: Select self-hosted runners or cloud fallbacks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      prepare_runner: ${{ steps.select.outputs.prepare_runner }}
      windows_runner: ${{ steps.select.outputs.windows_runner }}
      tui_runner: ${{ steps.select.outputs.tui_runner }}
      publish_runner: ${{ steps.select.outputs.publish_runner }}
      prepare_label_1: ${{ steps.select.outputs.prepare_label_1 }}
      prepare_label_2: ${{ steps.select.outputs.prepare_label_2 }}
      prepare_label_3: ${{ steps.select.outputs.prepare_label_3 }}
      windows_label_1: ${{ steps.select.outputs.windows_label_1 }}
      windows_label_2: ${{ steps.select.outputs.windows_label_2 }}
      windows_label_3: ${{ steps.select.outputs.windows_label_3 }}
      tui_label_1: ${{ steps.select.outputs.tui_label_1 }}
      tui_label_2: ${{ steps.select.outputs.tui_label_2 }}
      tui_label_3: ${{ steps.select.outputs.tui_label_3 }}
      publish_label_1: ${{ steps.select.outputs.publish_label_1 }}
      publish_label_2: ${{ steps.select.outputs.publish_label_2 }}
      publish_label_3: ${{ steps.select.outputs.publish_label_3 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select available runner labels
        id: select
        shell: bash
        run: |
          set -euo pipefail

          if ! inventory=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100"); then
            echo "::warning::Could not inspect self-hosted runners; using cloud fallbacks."
            inventory='[]'
          fi

          has_idle_runner() {
            local os_label="$1"
            jq -e --arg os_label "$os_label" '
              [ .[] | .runners[]? |
                select(.status == "online" and .busy == false) |
                [ .labels[]?.name | ascii_downcase ] as $labels |
                select(($labels | index("self-hosted")) != null) |
                select(($labels | index(($os_label | ascii_downcase))) != null) |
                select(($labels | index("x64")) != null)
              ] | length > 0
            ' <<<"$inventory" >/dev/null
          }

          choose_runner() {
            local output_name="$1"
            local os_label="$2"
            local cloud_label="$3"
            local runner_json
            local selected_from
            local label_1
            local label_2
            local label_3

            if has_idle_runner "$os_label"; then
              runner_json=$(jq -cn --arg os_label "$os_label" \
                '["self-hosted", $os_label, "X64"]')
              selected_from="self-hosted/$os_label/X64"
              label_1='self-hosted'
              label_2="$os_label"
              label_3='X64'
            else
              runner_json=$(jq -cn --arg cloud_label "$cloud_label" \
                '[$cloud_label]')
              selected_from="$cloud_label"
              label_1="$cloud_label"
              label_2="$cloud_label"
              label_3="$cloud_label"
            fi

            {
              printf '%s=%s\n' "$output_name" "$runner_json"
              printf '%s_label_1=%s\n' "$output_name" "$label_1"
              printf '%s_label_2=%s\n' "$output_name" "$label_2"
              printf '%s_label_3=%s\n' "$output_name" "$label_3"
            } >> "$GITHUB_OUTPUT"
            echo "$output_name: $selected_from"
          }

          # A runner is selected only when it is online and idle at dispatch
          # time. If the inventory is unavailable or no matching runner is
          # idle, the corresponding lane uses its hosted cloud runner.
          choose_runner prepare_runner Linux ubuntu-latest
          choose_runner windows_runner Windows windows-2022
          choose_runner tui_runner Linux ubuntu-latest
          choose_runner publish_runner Linux ubuntu-latest

  prepare:
    name: Prepare exact release target
    needs: runner_selection
    runs-on:
      - ${{ needs.runner_selection.outputs.prepare_label_1 }}
      - ${{ needs.runner_selection.outputs.prepare_label_2 }}
      - ${{ needs.runner_selection.outputs.prepare_label_3 }}
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      windows_runner: ${{ needs.runner_selection.outputs.windows_runner }}
      tui_runner: ${{ needs.runner_selection.outputs.tui_runner }}
      publish_runner: ${{ needs.runner_selection.outputs.publish_runner }}
      windows_label_1: ${{ needs.runner_selection.outputs.windows_label_1 }}
      windows_label_2: ${{ needs.runner_selection.outputs.windows_label_2 }}
      windows_label_3: ${{ needs.runner_selection.outputs.windows_label_3 }}
      tui_label_1: ${{ needs.runner_selection.outputs.tui_label_1 }}
      tui_label_2: ${{ needs.runner_selection.outputs.tui_label_2 }}
      tui_label_3: ${{ needs.runner_selection.outputs.tui_label_3 }}
      publish_label_1: ${{ needs.runner_selection.outputs.publish_label_1 }}
      publish_label_2: ${{ needs.runner_selection.outputs.publish_label_2 }}
      publish_label_3: ${{ needs.runner_selection.outputs.publish_label_3 }}
    env:
      RELEASE_TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Require a main-branch manual dispatch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Super Express Release must be dispatched from main." >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TARGET_SHA }}
          fetch-depth: 0

      - name: Require the exact dispatched commit
        shell: bash
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match $RELEASE_TARGET_SHA." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create a cross-lane monotonic package version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./app/package.json').version")
          version=$(node script/release-version.js create "$base" "$GITHUB_RUN_ID")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require an unused immutable tag
        id: target
        shell: bash
        env:
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            2) ;;
            0)
              echo "Release tag $RELEASE_TAG already exists; refusing to replace it." >&2
              exit 1
              ;;
            *)
              echo "Unable to prove $RELEASE_TAG is unused (status $status)." >&2
              exit "$status"
              ;;
          esac
          echo "sha=$RELEASE_TARGET_SHA" >> "$GITHUB_OUTPUT"

  windows:
    name: Super Express Windows x64
    needs: prepare
    uses: ./.github/workflows/super-express-release-windows.yml
    with:
      release_target_sha: ${{ needs.prepare.outputs.sha }}
      release_version: ${{ needs.prepare.outputs.version }}
      runner: ${{ needs.prepare.outputs.windows_runner }}
    secrets: inherit

  tui:
    name: Super Express Linux TUI
    needs: prepare
    uses: ./.github/workflows/super-express-release-linux-tui.yml
    with:
      release_target_sha: ${{ needs.prepare.outputs.sha }}
      runner: ${{ needs.prepare.outputs.tui_runner }}
    secrets: inherit

  publish:
    name: Publish combined GitHub Release
    needs:
      - prepare
      - windows
      - tui
    if: >-
      always() && needs.prepare.result == 'success' && needs.windows.result ==
      'success' && needs.tui.result == 'success' && inputs.publish
    runs-on:
      - ${{ needs.prepare.outputs.publish_label_1 }}
      - ${{ needs.prepare.outputs.publish_label_2 }}
      - ${{ needs.prepare.outputs.publish_label_3 }}
    permissions:
      contents: write
    env:
      RELEASE_TARGET_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN:
        ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN
        }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Discover exact TUI package version
        id: tui_version
        working-directory: tui
        shell: bash
        run: |
          version=$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -z "$version" ] || [[ "$version" == *[[:space:]]* ]]; then
            echo "TUI pyproject.toml did not provide one usable package version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name:
            super-express-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/installers

      - uses: actions/download-artifact@v8
        with:
          name: super-express-tui-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/tui

      - name: Verify downloaded release payload
        shell: bash
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
        run: |
          required=(
            release-payload/installers/RELEASES
            "release-payload/installers/GitHub Desktop-x64.zip"
            release-payload/installers/GitHubDesktopSetup-x64.exe
            release-payload/installers/GitHubDesktopSetup-x64.msi
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-full.nupkg"
            "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"
            "release-payload/tui/desktop_material_tui-${TUI_VERSION}-py3-none-any.whl"
            "release-payload/tui/desktop_material_tui-${TUI_VERSION}.tar.gz"
            "release-payload/tui/desktop_material_tui-${TUI_VERSION}-runtime-requirements.txt"
            release-payload/tui/install-linux-tui.sh
            release-payload/tui/bootstrap-linux-tui.sh
          )
          for asset in "${required[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty downloaded release asset: $asset" >&2
              exit 1
            fi
          done
          test -x release-payload/tui/install-linux-tui.sh
          test -x release-payload/tui/bootstrap-linux-tui.sh

      - name: Write fast local commit note
        shell: bash
        run: |
          {
            echo "Super Express package for commit \`$RELEASE_TARGET_SHA\`."
            echo
            echo 'Windows x64 and Linux TUI packages were built in parallel.'
            echo 'This emergency lane deliberately runs no test or lint gates.'
            echo
            echo '### Commit'
            echo
            git show --no-patch --format='%s%n%n%b' "$RELEASE_TARGET_SHA" | \
              sed 's/^/    /'
            echo
            echo '## Lines of code'
            echo
            node script/count-lines.mjs
            echo
            echo "Counted by CI over \`$RELEASE_TARGET_SHA\` with \`node script/count-lines.mjs\`."
          } > release-payload/release-notes.md

      - name: Preserve combined payload and notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: super-express-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          assets=(release-payload/installers/* release-payload/tui/*)
          shopt -u nullglob
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Desktop Material $RELEASE_VERSION" \
            --notes-file release-payload/release-notes.md \
            --latest=false
          create_status=$?
          set -e
          if [ "$create_status" -ne 0 ]; then
            # 2026-07-26: the workflow token began receiving 403s from
            # POST /releases for non-prerelease creation while prerelease
            # creation kept succeeding. Recover without replacing the tag.
            echo "Direct release creation failed with status $create_status;" \
              "falling back to prerelease-then-clear." >&2
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_TARGET_SHA" \
              -f name="Desktop Material $RELEASE_VERSION" \
              -F prerelease=true \
              -f make_latest=false \
              -F body=@release-payload/release-notes.md >/dev/null
            gh release upload "$RELEASE_TAG" \
              "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false --latest=false
          fi

      - name: Verify published release target and assets
        shell: bash
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG"
          published=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [ "$published" != "$RELEASE_TARGET_SHA" ]; then
            echo "Published tag resolves to $published, expected $RELEASE_TARGET_SHA." >&2
            exit 1
          fi
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "Published release unexpectedly remained a draft." >&2
            exit 1
          fi
          published_assets=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for expected in \
            'RELEASES' \
            'GitHub Desktop-x64.zip' \
            'GitHubDesktopSetup-x64.exe' \
            'GitHubDesktopSetup-x64.msi' \
            "GitHubDesktop-${RELEASE_VERSION}-full.nupkg" \
            "GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg" \
            "desktop_material_tui-${TUI_VERSION}-py3-none-any.whl" \
            "desktop_material_tui-${TUI_VERSION}.tar.gz" \
            "desktop_material_tui-${TUI_VERSION}-runtime-requirements.txt" \
            'install-linux-tui.sh' \
            'bootstrap-linux-tui.sh'; do
            if ! grep -Fqx "$expected" <<<"$published_assets"; then
              echo "Published release is missing asset $expected." >&2
              exit 1
            fi
          done

      - name: Reconcile Latest to the newest main release
        shell: bash
        run: bash .github/scripts/promote-current-release.sh
