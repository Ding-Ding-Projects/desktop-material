name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        default: desktop/desktop
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        default: ''
        required: false
      sign:
        type: boolean
        default: true
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_SECRET:

# Every invocation owns a unique group so a newer push, pull request, manual
# dispatch, or installer verification can run immediately without cancelling
# or queueing an older in-progress CI run.
concurrency:
  group: ci-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code
  linux-tui:
    name: Linux TUI · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock
      - name: Install locked TUI environment
        working-directory: tui
        run:
          uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Verify generated parity contract
        run: node tui/tools/generate-parity-contract.mjs --check
      - name: Run TUI tests
        working-directory: tui
        run: uv run --python "${{ matrix.python-version }}" pytest
      - name: Run TUI lint and types
        if: matrix.python-version == '3.12'
        working-directory: tui
        run: |
          uv run ruff check .
          uv run mypy src
      - name: Build wheel and source distribution
        if: matrix.python-version == '3.12'
        working-directory: tui
        run: uv build --clear
      - name: Smoke-test the built wheel
        if: matrix.python-version == '3.12'
        run: |
          wheel="$(find tui/dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv "$RUNNER_TEMP/desktop-material-tui-smoke" --python 3.12
          uv pip install \
            --python "$RUNNER_TEMP/desktop-material-tui-smoke/bin/python" \
            "$wheel"
          "$RUNNER_TEMP/desktop-material-tui-smoke/bin/desktop-material-tui" \
            --version
      - name: Upload Linux TUI packages
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-material-tui-python
          path: tui/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Build and smoke-test the Linux TUI container
        if: matrix.python-version == '3.12'
        env:
          IMAGE_NAME: desktop-material-tui:ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker build --check --file tui/Dockerfile tui
          docker build --file tui/Dockerfile --tag "$IMAGE_NAME" tui
          trap 'docker image rm --force "$IMAGE_NAME" >/dev/null 2>&1 || true' EXIT

          expected=$(cd tui && uv run --python 3.12 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          reported=$(docker run --rm "$IMAGE_NAME" --version)
          if [ "$reported" != "desktop-material-tui $expected" ]; then
            echo "Container entry point reported '$reported', expected version $expected." >&2
            exit 1
          fi

          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_NAME")" = dmt
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$IMAGE_NAME")" \
            = '["desktop-material-tui"]'
  windows-tui-core:
    name: Windows TUI core · Python 3.12
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock
      - name: Install locked TUI environment
        working-directory: tui
        run: uv sync --locked --extra dev --python 3.12
      - name: Test non-PTY CLI, Cheap LFS, and core services
        working-directory: tui
        run: >-
          uv run --python 3.12 pytest tests/unit tests/application
          tests/infrastructure
      - name: Lint and type-check cross-platform core
        working-directory: tui
        run: |
          uv run ruff check src tests/unit tests/application tests/infrastructure
          uv run mypy src
  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        arch: [x64, arm64]
        include:
          - os: windows-2022
            friendlyName: Windows
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install
          yarn test
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Run unit tests
        if: matrix.arch == 'x64'
        run: yarn test:unit
      - name: Run script tests
        run: yarn test:script
      - uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: ${{ inputs.upload-artifacts }}
        with:
          name: ${{matrix.friendlyName}}-${{matrix.arch}}
          path: |
            dist/GitHub Desktop-${{matrix.arch}}.zip
            dist/GitHubDesktop-*.nupkg
            dist/GitHubDesktopSetup-${{matrix.arch}}.exe
            dist/GitHubDesktopSetup-${{matrix.arch}}.msi
            dist/bundle-size.json
            dist/bundle-hash.json
          if-no-files-found: error
  e2e-smoke:
    name: E2E Smoke ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            friendlyName: Windows
            arch: x64
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
          install-ffmpeg: 'true'
      - name: Select mock update server port
        uses: ./.github/actions/setup-e2e-update-port
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Install app on Windows
        shell: pwsh
        run: |
          function Write-SquirrelLogs {
            $logPaths = @(
              "$env:LOCALAPPDATA\SquirrelSetup.log",
              "$env:LOCALAPPDATA\GitHubDesktop\SquirrelSetup.log"
            )

            foreach ($logPath in $logPaths) {
              if (Test-Path $logPath) {
                Write-Host "Showing log: $logPath"
                Get-Content $logPath -Tail 200
              }
            }
          }

          $setupExe = "dist/GitHubDesktopSetup-${{ matrix.arch }}.exe"
          $installer = Start-Process -FilePath $setupExe -ArgumentList "/S" -PassThru

          try {
            Wait-Process -Id $installer.Id -Timeout 300 -ErrorAction Stop
          } catch {
            Write-SquirrelLogs
            throw "Windows installer timed out after 300 seconds"
          }

          Get-Process GitHubDesktop -ErrorAction SilentlyContinue | Stop-Process -Force

          $installedExe = $null
          for ($attempt = 0; $attempt -lt 30 -and -not $installedExe; $attempt++) {
            $installedExe = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop\app-*\GitHubDesktop.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $installedExe) {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $installedExe) {
            Write-SquirrelLogs
            throw "Unable to locate installed GitHub Desktop executable"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DESKTOP_E2E_APP_PATH=$installedExe"
      - name: Run packaged E2E smoke tests
        run: yarn test:e2e:run:packaged
      - name: Upload E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{matrix.friendlyName}}-${{matrix.arch}}
          path: playwright-videos/**
          if-no-files-found: warn
