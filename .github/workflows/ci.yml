name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        default: desktop/desktop
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        default: ''
        required: false
      sign:
        type: boolean
        default: true
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_SECRET:

# Every invocation owns a unique group so a newer push, pull request, manual
# dispatch, or installer verification can run immediately without cancelling
# or queueing an older in-progress CI run.
#
# This is a deliberate safety contract, enforced by
# app/test/unit/ci-workflow-safety-test.ts: the installer workflow triggers on
# this workflow's `workflow_run` completion and publishes a Release only when
# CI concludes `success`, so a cancelled main run silently skips a release —
# and a queued one is just as dangerous, because a third run entering an
# occupied group cancels the pending one. Saving runner minutes by cancelling
# superseded runs is not worth a release that quietly never ships.
concurrency:
  group: ci-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      # --frozen-lockfile turns a lock file that no longer matches the manifests
      # into an immediate, named failure instead of a silent re-resolution that
      # only the working-directory check at the end of this job would catch.
      - run: yarn install --frozen-lockfile
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      # No install: the provenance check reads the lock files, and `yarn audit`
      # builds its tree from yarn.lock plus the in-repo `file:` dependency
      # directories under vendor/, none of which are submodules.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify lock file provenance and integrity
        run: |
          set -uo pipefail
          # This check is offline and deterministic — it only reads files that
          # are already in the commit — which is why it is allowed to fail the
          # build. An entry that suddenly resolves from another host, or that
          # lost its subresource hash, means the lock file no longer pins what
          # it claims to.
          #
          # Entries without a `resolved` line (the `file:` resolutions pointing
          # at vendor/) are reviewed as repository code and skipped.
          # vendor/desktop-trampoline/yarn.lock is upstream's own file and is
          # not audited here; three of its entries predate `integrity`.
          status=0
          for lock in yarn.lock app/yarn.lock; do
            echo "Checking $(grep -c '^  resolved ' "$lock") resolved packages in $lock"
            awk -v lock="$lock" '
              function flush() {
                if (resolved != "" && integrity == "") {
                  printf "%s: %s is resolved without an integrity hash\n", lock, entry
                  bad = 1
                }
                resolved = ""
                integrity = ""
              }
              /^[^ \t#]/ { flush(); entry = $0; next }
              /^  resolved / {
                resolved = $2
                gsub(/"/, "", resolved)
                host = resolved
                sub(/^https?:\/\//, "", host)
                sub(/\/.*$/, "", host)
                if (host != "registry.yarnpkg.com" && host != "registry.npmjs.org") {
                  printf "%s: %s resolves from unexpected host %s\n", lock, entry, host
                  bad = 1
                }
                next
              }
              /^  integrity / { integrity = $2; next }
              END { flush(); exit (bad ? 1 : 0) }
            ' "$lock" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error title=Lock file provenance::A lock file entry resolves from an unexpected host or carries no integrity hash. Review the diff to yarn.lock before merging."
            exit 1
          fi
      - name: Report dependency advisories
        run: |
          set -uo pipefail
          # `yarn audit` exits with a bitfield of the severities it found, so
          # gating on it would turn every commit red for a transitive advisory
          # with no published fix — a state no commit in this repository can
          # repair. Advisories are therefore surfaced in the job summary and as
          # warning annotations, and this step always succeeds.
          set +e
          audited=0
          for target in . app; do
            label=root
            if [ "$target" != "." ]; then
              label="$target"
            fi
            out="$RUNNER_TEMP/yarn-audit-$label.txt"
            # --no-color keeps ANSI escapes out of the job summary's code block.
            (cd "$target" && yarn audit --no-progress --no-color) >"$out" 2>&1
            code=$?
            {
              echo "### Dependency advisories — \`$label\`"
              echo
            } >>"$GITHUB_STEP_SUMMARY"
            if ! grep -q 'Packages audited' "$out"; then
              echo "::warning title=Dependency audit unavailable ($label)::yarn audit did not complete (exit $code); advisories were not evaluated for this manifest."
              {
                echo "> [!WARNING]"
                echo "> \`yarn audit\` did not complete (exit \`$code\`)."
                echo "> Advisories were **not** evaluated for this manifest."
                echo
              } >>"$GITHUB_STEP_SUMMARY"
            else
              audited=$((audited + 1))
              found=$(grep -E 'vulnerabilities found|^Severity:' "$out" | tr '\n' ' ')
              if [ "$code" -eq 0 ]; then
                echo "$found" >>"$GITHUB_STEP_SUMMARY"
              else
                echo "::warning title=Dependency advisories ($label)::$found See the job summary for the full report."
                {
                  echo "$found"
                  echo
                  echo "\`yarn audit\` exit code \`$code\` is a severity bitfield"
                  echo "(1 info, 2 low, 4 moderate, 8 high, 16 critical), not a"
                  echo "build failure."
                  echo
                } >>"$GITHUB_STEP_SUMMARY"
              fi
            fi
            {
              echo '<details><summary>Full report</summary>'
              echo
              echo '```text'
              # `head -c` can cut mid-line, so force a newline before the
              # closing fence; otherwise it lands inside the last line and the
              # code block never closes, swallowing the rest of the summary.
              head -c 60000 "$out"
              echo
              echo '```'
              echo
              echo '</details>'
              echo
            } >>"$GITHUB_STEP_SUMMARY"
          done
          if [ "$audited" -eq 0 ]; then
            echo "::warning title=Dependency audit unavailable::No manifest could be audited in this run; treat this run as carrying no advisory evidence."
          fi
          exit 0
  linux-tui:
    name: Linux TUI · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock
      - name: Install locked TUI environment
        working-directory: tui
        run:
          uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Verify generated parity contract
        run: node tui/tools/generate-parity-contract.mjs --check
      - name: Run TUI tests
        working-directory: tui
        run: uv run --python "${{ matrix.python-version }}" pytest
      - name: Run TUI lint and types
        if: matrix.python-version == '3.12'
        working-directory: tui
        run: |
          uv run ruff check .
          uv run mypy src
      - name: Build wheel and source distribution
        if: matrix.python-version == '3.12'
        working-directory: tui
        run: uv build --clear
      - name: Smoke-test the built wheel
        if: matrix.python-version == '3.12'
        run: |
          wheel="$(find tui/dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv "$RUNNER_TEMP/desktop-material-tui-smoke" --python 3.12
          uv pip install \
            --python "$RUNNER_TEMP/desktop-material-tui-smoke/bin/python" \
            "$wheel"
          "$RUNNER_TEMP/desktop-material-tui-smoke/bin/desktop-material-tui" \
            --version
      - name: Upload Linux TUI packages
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-material-tui-python
          path: tui/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Build and smoke-test the Linux TUI container
        if: matrix.python-version == '3.12'
        env:
          IMAGE_NAME: desktop-material-tui:ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          docker build --check --file tui/Dockerfile tui
          docker build --file tui/Dockerfile --tag "$IMAGE_NAME" tui
          trap 'docker image rm --force "$IMAGE_NAME" >/dev/null 2>&1 || true' EXIT

          expected=$(cd tui && uv run --python 3.12 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          reported=$(docker run --rm "$IMAGE_NAME" --version)
          if [ "$reported" != "desktop-material-tui $expected" ]; then
            echo "Container entry point reported '$reported', expected version $expected." >&2
            exit 1
          fi

          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_NAME")" = dmt
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$IMAGE_NAME")" \
            = '["desktop-material-tui"]'
  windows-tui-core:
    name: Windows TUI core · Python 3.12
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock
      - name: Install locked TUI environment
        working-directory: tui
        run: uv sync --locked --extra dev --python 3.12
      - name: Test non-PTY CLI, Cheap LFS, and core services
        working-directory: tui
        run: >-
          uv run --python 3.12 pytest tests/unit tests/application
          tests/infrastructure
      - name: Lint and type-check cross-platform core
        working-directory: tui
        run: |
          uv run ruff check src tests/unit tests/application tests/infrastructure
          uv run mypy src
  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        arch: [x64, arm64]
        include:
          - os: windows-2022
            friendlyName: Windows
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install --frozen-lockfile
          yarn test
      - name: Build production app
        id: production_build
        if: ${{ always() }}
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Run unit tests
        if: matrix.arch == 'x64'
        run: yarn test:unit
      - name: Run script tests
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        run: yarn test:script
      - uses: ./.github/actions/setup-windows-signing
        id: windows_signing
        if: ${{ always() && steps.production_build.outcome == 'success' }}
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        id: installer_package
        if:
          ${{ always() && steps.production_build.outcome == 'success' &&
          steps.windows_signing.outcome == 'success' }}
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        # Preserve a usable installer even when a test step fails. The job
        # still reports the original test failure; this only keeps its build
        # output available for diagnosis and recovery.
        if:
          ${{ always() && steps.installer_package.outcome == 'success' &&
          (github.event_name != 'workflow_call' || inputs.upload-artifacts) }}
        with:
          name: ${{matrix.friendlyName}}-${{matrix.arch}}
          path: |
            dist/GitHub Desktop-${{matrix.arch}}.zip
            dist/GitHubDesktop-*.nupkg
            dist/GitHubDesktopSetup-${{matrix.arch}}.exe
            dist/GitHubDesktopSetup-${{matrix.arch}}.msi
            dist/bundle-size.json
            dist/bundle-hash.json
          if-no-files-found: error
  e2e-smoke:
    name: E2E Smoke ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            friendlyName: Windows
            arch: x64
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
          install-ffmpeg: 'true'
      - name: Select mock update server port
        uses: ./.github/actions/setup-e2e-update-port
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Install app on Windows
        shell: pwsh
        run: |
          function Write-SquirrelLogs {
            $logPaths = @(
              "$env:LOCALAPPDATA\SquirrelSetup.log",
              "$env:LOCALAPPDATA\GitHubDesktop\SquirrelSetup.log"
            )

            foreach ($logPath in $logPaths) {
              if (Test-Path $logPath) {
                Write-Host "Showing log: $logPath"
                Get-Content $logPath -Tail 200
              }
            }
          }

          $setupExe = "dist/GitHubDesktopSetup-${{ matrix.arch }}.exe"
          $installer = Start-Process -FilePath $setupExe -ArgumentList "/S" -PassThru

          try {
            Wait-Process -Id $installer.Id -Timeout 300 -ErrorAction Stop
          } catch {
            Write-SquirrelLogs
            throw "Windows installer timed out after 300 seconds"
          }

          Get-Process GitHubDesktop -ErrorAction SilentlyContinue | Stop-Process -Force

          $installedExe = $null
          for ($attempt = 0; $attempt -lt 30 -and -not $installedExe; $attempt++) {
            $installedExe = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop\app-*\GitHubDesktop.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $installedExe) {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $installedExe) {
            Write-SquirrelLogs
            throw "Unable to locate installed GitHub Desktop executable"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DESKTOP_E2E_APP_PATH=$installedExe"
      - name: Run packaged E2E smoke tests
        run: yarn test:e2e:run:packaged
      - name: Upload E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{matrix.friendlyName}}-${{matrix.arch}}
          path: playwright-videos/**
          if-no-files-found: warn
