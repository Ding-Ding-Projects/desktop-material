name: 'Create Release Pull Request'

on: create

jobs:
  build:
    name: Create Release Pull Request
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        if: |
          startsWith(github.ref, 'refs/heads/releases/') && !contains(github.ref, 'test')

      - name: Create Pull Request content
        if: |
          startsWith(github.ref, 'refs/heads/releases/') && !contains(github.ref, 'test')
        run: |
          release_branch=${GITHUB_REF#refs/heads/}
          PR_TITLE=$(./script/draft-release/release-pr-content.sh title "$release_branch")
          PR_BODY=$(./script/draft-release/release-pr-content.sh body "$release_branch")

          {
            echo "PR_BODY<<EOF"
            echo "$PR_BODY"
            echo "EOF"
            echo "PR_TITLE<<EOF"
            echo "$PR_TITLE"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/create-github-app-token@v3
        id: generate-token
        if: |
          startsWith(github.ref, 'refs/heads/releases/') && !contains(github.ref, 'test')
        with:
          app-id: ${{ secrets.DESKTOP_RELEASES_APP_ID }}
          private-key: ${{ secrets.DESKTOP_RELEASES_APP_PRIVATE_KEY }}

      - name: Create Release Pull Request
        if: |
          startsWith(github.ref, 'refs/heads/releases/') && !contains(github.ref, 'test')
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh pr create \
            --head "${{ github.ref_name }}" \
            --base main \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --draft
