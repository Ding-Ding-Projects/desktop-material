name: Super Express Release / Linux TUI

# Reusable zero-test Linux TUI lane for Super Express Release. It is
# deliberately self-hosted-only and queues until the registered Linux x64 WSL
# runner is ready.
on:
  workflow_call:
    inputs:
      release_target_sha:
        description: Exact commit SHA selected by the dispatcher
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_target_sha:
        description:
          Exact main-branch commit to package; blank uses the dispatched commit
        required: false
        type: string

concurrency:
  group: super-express-release-linux-tui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Linux TUI packages (self-hosted)
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 30
    env:
      RELEASE_TARGET_SHA: ${{ inputs.release_target_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_target_sha || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/super-express-linux-tui-build
        with:
          release_target_sha: ${{ inputs.release_target_sha || github.sha }}
