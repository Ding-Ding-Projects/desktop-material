name: Super Express Release / Linux TUI

# Reusable zero-test Linux TUI lane for Super Express Release. It runs on a
# native Ubuntu runner instead of consuming time on the Windows packaging
# runner. The caller owns release-tag creation and publication.
on:
  workflow_call:
    inputs:
      release_target_sha:
        description: Exact commit SHA selected by the dispatcher
        required: true
        type: string
      runner:
        description: JSON runner-label array selected by the dispatcher
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_target_sha:
        description:
          Exact main-branch commit to package; blank uses the dispatched commit
        required: false
        type: string
      runner:
        description:
          Optional JSON runner-label array override; blank auto-selects
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  runner_selection:
    name: Select self-hosted runner or cloud fallback
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_RUNNER: ${{ inputs.runner }}
    steps:
      - name: Select available Linux x64 runner labels
        id: select
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_RUNNER:-}" ]; then
            if ! jq -e 'type == "array" and length > 0' <<<"$REQUESTED_RUNNER" >/dev/null; then
              echo "The runner override must be a non-empty JSON label array." >&2
              exit 1
            fi
            printf 'runner=%s\n' "$REQUESTED_RUNNER" >> "$GITHUB_OUTPUT"
            echo "runner: caller-selected"
            exit 0
          fi

          if ! inventory=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100"); then
            echo "::warning::Could not inspect self-hosted runners; using ubuntu-latest."
            inventory='[]'
          fi

          if jq -e '
            [ .[] | .runners[]? |
              select(.status == "online" and .busy == false) |
              [ .labels[]?.name | ascii_downcase ] as $labels |
              select(($labels | index("self-hosted")) != null) |
              select(($labels | index("linux")) != null) |
              select(($labels | index("x64")) != null)
            ] | length > 0
          ' <<<"$inventory" >/dev/null; then
            runner='["self-hosted","Linux","X64"]'
            selected_from='self-hosted/Linux/X64'
          else
            runner='["ubuntu-latest"]'
            selected_from='ubuntu-latest'
          fi

          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"
          echo "runner: $selected_from"

  build:
    name: Build Linux TUI packages
    needs: runner_selection
    runs-on: ${{ fromJSON(needs.runner_selection.outputs.runner) }}
    timeout-minutes: 30
    env:
      RELEASE_TARGET_SHA: ${{ inputs.release_target_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_target_sha || github.sha }}
          fetch-depth: 0

      - name: Require a main-branch manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Direct Super Express Linux TUI dispatches must use main." >&2
            exit 1
          fi

      - name: Require the exact release commit
        shell: bash
        run: |
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
            echo "Checked-out commit $checked_out does not match $RELEASE_TARGET_SHA." >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: tui/uv.lock

      - name: Discover exact TUI package version
        id: tui_version
        working-directory: tui
        shell: bash
        run: |
          version=$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -z "$version" ] || [[ "$version" == *[[:space:]]* ]]; then
            echo "TUI pyproject.toml did not provide one usable package version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build TUI wheel and source distribution
        working-directory: tui
        run: uv build --clear

      - name: Export lock-derived runtime constraints
        working-directory: tui
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
        run: >-
          uv export --locked --no-dev --no-emit-project --no-hashes
          --output-file
          "dist/desktop_material_tui-${TUI_VERSION}-runtime-requirements.txt"

      - name: Collect and verify Linux TUI release payload
        id: tui_payload
        shell: bash
        env:
          TUI_VERSION: ${{ steps.tui_version.outputs.version }}
        run: |
          shopt -s nullglob
          wheels=(tui/dist/*.whl)
          sdists=(tui/dist/*.tar.gz)
          constraints=(tui/dist/*-runtime-requirements.txt)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ] || \
             [ "${#constraints[@]}" -ne 1 ]; then
            echo "Expected exactly one TUI wheel, source distribution, and constraints file." >&2
            exit 1
          fi

          expected_wheel="desktop_material_tui-${TUI_VERSION}-py3-none-any.whl"
          expected_sdist="desktop_material_tui-${TUI_VERSION}.tar.gz"
          expected_constraints="desktop_material_tui-${TUI_VERSION}-runtime-requirements.txt"
          wheel_name=$(basename "${wheels[0]}")
          sdist_name=$(basename "${sdists[0]}")
          constraints_name=$(basename "${constraints[0]}")
          if [ "$wheel_name" != "$expected_wheel" ] || \
             [ "$sdist_name" != "$expected_sdist" ] || \
             [ "$constraints_name" != "$expected_constraints" ]; then
            echo "Built TUI package names do not match pyproject.toml version $TUI_VERSION." >&2
            exit 1
          fi

          installer_name=install-linux-tui.sh
          bootstrap_name=bootstrap-linux-tui.sh
          sh -n script/install-linux-tui.sh
          sh -n script/bootstrap-linux-tui.sh
          mkdir -p release-payload/tui
          cp "${wheels[0]}" "${sdists[0]}" "${constraints[0]}" \
            script/install-linux-tui.sh script/bootstrap-linux-tui.sh \
            release-payload/tui/
          chmod 0755 "release-payload/tui/$installer_name" \
            "release-payload/tui/$bootstrap_name"
          for asset in \
            "release-payload/tui/$wheel_name" \
            "release-payload/tui/$sdist_name" \
            "release-payload/tui/$constraints_name" \
            "release-payload/tui/$installer_name" \
            "release-payload/tui/$bootstrap_name"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty Linux TUI release asset: $asset" >&2
              exit 1
            fi
          done
          test -x "release-payload/tui/$installer_name"
          test -x "release-payload/tui/$bootstrap_name"

      - name: Preserve Linux TUI payload artifact
        uses: actions/upload-artifact@v7
        with:
          name: super-express-tui-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-payload/tui/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
