name: Super Express Release / Linux TUI

# Reusable zero-test Linux TUI lane for Super Express Release. It runs on
# GitHub-hosted ubuntu-latest runners so a dispatch never queues behind an
# offline machine.
on:
  workflow_call:
    inputs:
      release_target_sha:
        description: Exact commit SHA selected by the dispatcher
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_target_sha:
        description:
          Exact main-branch commit to package; blank uses the dispatched commit
        required: false
        type: string

concurrency:
  group: super-express-release-linux-tui-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Linux TUI packages
    # Reusable calls may only come from this repository's protected main
    # workflow. Manual emergency dispatch remains the only direct caller.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name ==
      'workflow_call' && github.repository ==
      'Ding-Ding-Projects/desktop-material' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TARGET_SHA: ${{ inputs.release_target_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_target_sha || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/super-express-linux-tui-build
        with:
          release_target_sha: ${{ inputs.release_target_sha || github.sha }}
