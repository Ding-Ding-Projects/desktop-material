name: Super Express Release / Linux TUI

# Reusable zero-test Linux TUI lane for Super Express Release. It uses the
# fixed ubuntu-latest hosted label so GitHub can schedule it without runner
# discovery.
on:
  workflow_call:
    inputs:
      release_target_sha:
        description: Exact commit SHA selected by the dispatcher
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_target_sha:
        description:
          Exact main-branch commit to package; blank uses the dispatched commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Linux TUI packages (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TARGET_SHA: ${{ inputs.release_target_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_target_sha || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/super-express-linux-tui-build
        with:
          release_target_sha: ${{ inputs.release_target_sha || github.sha }}
