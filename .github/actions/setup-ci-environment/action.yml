name: Setup CI Environment
description: Set up Python, Node.js, and install dependencies.

inputs:
  node-version:
    description: Node.js version to use.
    required: true
  arch:
    description: Target architecture for dependency installation.
    required: true
runs:
  using: composite
  steps:
    - name: Reuse or install Git Bash on Windows self-hosted runners
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
      run:
        '& "$env:GITHUB_WORKSPACE\.github\scripts\ensure-windows-git-bash.ps1"'

    - name: Install Windows arm64 C++ toolset when missing
      if:
        ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' &&
        inputs.arch == 'arm64' }}
      shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
      run:
        '&
        "$env:GITHUB_WORKSPACE\.github\scripts\ensure-windows-arm64-build-tools.ps1"
        -TargetArchitecture "${{ inputs.arch }}"'

    - name: Install Windows ClangCL toolset when missing
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
      run:
        '& "$env:GITHUB_WORKSPACE\\.github\\scripts\\ensure-windows-clang.ps1"
        -TargetArchitecture "${{ inputs.arch }}"'

    - name: Capture Windows native toolchain fingerprint
      id: windows-toolchain
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
      run: |
        $installationPath = $env:npm_config_msvs_version
        if (-not $installationPath -or -not (Test-Path -LiteralPath $installationPath)) {
          throw 'The Windows native toolchain did not expose its selected Visual Studio installation path.'
        }
        $msvcRoot = Join-Path $installationPath 'VC\Tools\MSVC'
        $msvcVersions = @(
          Get-ChildItem -LiteralPath $msvcRoot -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name |
            Select-Object -ExpandProperty Name
        ) -join ','
        $platform = if ('${{ inputs.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
        $clangCandidates = @(
          (Join-Path $installationPath "VC\Tools\Llvm\$platform\bin\clang-cl.exe")
          (Join-Path $installationPath 'VC\Tools\Llvm\bin\clang-cl.exe')
        ) | Where-Object { Test-Path -LiteralPath $_ }
        $clangVersion = if ($clangCandidates) {
          (Get-Item -LiteralPath ($clangCandidates | Select-Object -First 1)).VersionInfo.FileVersion
        } else {
          'missing'
        }
        $sdkVersions = @(
          Get-ChildItem -LiteralPath 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name |
            Select-Object -ExpandProperty Name
        ) -join ','
        $payload = @(
          $installationPath
          $msvcVersions
          $clangVersion
          $sdkVersions
          '${{ inputs.arch }}'
        ) -join '|'
        $hasher = New-Object -TypeName System.Security.Cryptography.SHA256Managed
        try {
          $digest = $hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload))
        } finally {
          $hasher.Dispose()
        }
        $sha = ([BitConverter]::ToString($digest)).Replace('-', '').ToLowerInvariant()
        $runnerName = if ($env:RUNNER_NAME) { $env:RUNNER_NAME } else { 'self-hosted' }
        $runnerKey = [regex]::Replace($runnerName, '[^A-Za-z0-9_.-]', '-')
        "cache-suffix=$runnerKey-$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Restore exact installed dependencies on hosted runners
      id: installed-dependencies
      # The self-hosted runners keep their own dependency directories. The
      # actions/cache post step can hold a runner for an unbounded upload after
      # the real job has finished, so hosted runners retain the post-step cache
      # while Windows self-hosted runners use an explicit restore/save pair.
      if: ${{ runner.environment != 'self-hosted' }}
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          app/node_modules
          ~/.cache/ms-playwright
          ~/AppData/Local/ms-playwright
        key: >-
          installed-deps-v6-${{ runner.os }}-${{ runner.arch }}-target-${{
          inputs.arch }}-node-${{ inputs.node-version }}-py311-${{
          hashFiles('package.json', 'yarn.lock', 'app/package.json',
          'app/yarn.lock', '.yarnrc', 'app/.yarnrc', 'app/.npmrc',
          'script/post-install.ts',
          '.github/actions/setup-ci-environment/action.yml',
          '.github/scripts/ensure-windows-git-bash.ps1',
          '.github/scripts/ensure-windows-arm64-build-tools.ps1',
          '.github/scripts/ensure-windows-clang.ps1',
          '.github/scripts/bootstrap-pinned-yarn.ps1', 'vendor/yarn-1.21.1.js',
          'vendor/printenvz/**', 'vendor/windows-argv-parser/**',
          'vendor/desktop-notifications/**', 'vendor/desktop-trampoline/**') }}

    - name: Restore exact installed dependencies on Windows self-hosted runners
      id: installed-dependencies-self-hosted
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      uses: actions/cache/restore@v5
      with:
        path: |
          node_modules
          app/node_modules
          ~/.cache/ms-playwright
          ~/AppData/Local/ms-playwright
        key: >-
          installed-deps-v6-${{ runner.os }}-${{ runner.arch }}-runner-${{
          steps.windows-toolchain.outputs.cache-suffix }}-target-${{ inputs.arch
          }}-node-${{ inputs.node-version }}-py311-${{ hashFiles('package.json',
          'yarn.lock', 'app/package.json', 'app/yarn.lock', '.yarnrc',
          'app/.yarnrc', 'app/.npmrc', 'script/post-install.ts',
          '.github/actions/setup-ci-environment/action.yml',
          '.github/scripts/ensure-windows-git-bash.ps1',
          '.github/scripts/ensure-windows-arm64-build-tools.ps1',
          '.github/scripts/ensure-windows-clang.ps1',
          '.github/scripts/bootstrap-pinned-yarn.ps1', 'vendor/yarn-1.21.1.js',
          'vendor/printenvz/**', 'vendor/windows-argv-parser/**',
          'vendor/desktop-notifications/**', 'vendor/desktop-trampoline/**') }}
        # A legacy cache is only a warm start. Its cache-hit output remains
        # false, so the current lock files still drive a complete install.
        restore-keys: |
          installed-deps-v6-${{ runner.os }}-${{ runner.arch }}-runner-${{
          steps.windows-toolchain.outputs.cache-suffix }}-target-${{
          inputs.arch }}-node-${{ inputs.node-version }}-py311-
          installed-deps-v5-${{ runner.os }}-${{ runner.arch }}-target-${{
          inputs.arch }}-node-${{ inputs.node-version }}-py311-
          installed-deps-v4-${{ runner.os }}-${{ runner.arch }}-target-${{
          inputs.arch }}-node-${{ inputs.node-version }}-py311-

    - name: Select installed dependency cache result
      id: installed-dependencies-status
      shell: bash
      run: |
        if [ "${{ steps.installed-dependencies.outputs.cache-hit }}" = 'true' ] ||
          [ "${{ steps.installed-dependencies-self-hosted.outputs.cache-hit }}" = 'true' ]; then
          echo 'cache-hit=true' >> "$GITHUB_OUTPUT"
        else
          echo 'cache-hit=false' >> "$GITHUB_OUTPUT"
        fi

    - name:
        Use Node.js ${{ inputs.node-version }} before self-hosted Yarn bootstrap
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install uv for self-hosted Windows Python
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.11.26
        # Do not register setup-uv's post-run cache upload on self-hosted
        # runners. Dependency installation remains explicit and reproducible.
        enable-cache: false

    - name: Install uv for self-hosted Linux Python
      if: ${{ runner.os == 'Linux' && runner.environment == 'self-hosted' }}
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.11.26
        enable-cache: false

    - name: Install managed Python 3.11 on self-hosted Windows
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      shell: bash
      run: |
        uv python install 3.11
        python_path=$(uv python find 3.11)
        if [ -z "$python_path" ]; then
          echo 'uv did not return a Python 3.11 interpreter path.' >&2
          exit 1
        fi
        echo "npm_config_python=$python_path" >> "$GITHUB_ENV"
        echo 'UV_PYTHON=3.11' >> "$GITHUB_ENV"

    - name: Install managed Python 3.11 on self-hosted Linux
      if: ${{ runner.os == 'Linux' && runner.environment == 'self-hosted' }}
      shell: bash
      run: |
        uv python install 3.11
        python_path=$(uv python find 3.11)
        if [ -z "$python_path" ]; then
          echo 'uv did not return a Python 3.11 interpreter path.' >&2
          exit 1
        fi
        echo "npm_config_python=$python_path" >> "$GITHUB_ENV"
        echo 'UV_PYTHON=3.11' >> "$GITHUB_ENV"

    - name: Provide repository-pinned Yarn to self-hosted Windows actions
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
      run: '& "$env:GITHUB_WORKSPACE\.github\scripts\bootstrap-pinned-yarn.ps1"'

    - name: Expose repository-pinned Yarn to Git Bash
      if: ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' }}
      shell: bash
      run: |
        # GitHub's Windows PATH bridge keeps the Windows spelling for later
        # PowerShell/cmd actions. Git Bash needs the same directory in MSYS
        # form, otherwise the following cache and install steps cannot find
        # the freshly-created yarn.cmd shim.
        shim_root="$(cygpath -u "$RUNNER_TEMP/desktop-material-pinned-yarn")"
        if [ ! -f "$shim_root/yarn.cmd" ]; then
          echo "Pinned Yarn shim is missing: $shim_root/yarn.cmd" >&2
          exit 1
        fi
        if [ ! -f "$shim_root/yarn" ]; then
          echo "Git Bash Yarn shim is missing: $shim_root/yarn" >&2
          exit 1
        fi
        chmod +x "$shim_root/yarn"
        echo "$shim_root" >> "$GITHUB_PATH"
        export PATH="$shim_root:$PATH"
        hash -r
        resolved_yarn="$(command -v yarn || true)"
        if [ "$resolved_yarn" != "$shim_root/yarn" ]; then
          echo "Git Bash resolved an unexpected Yarn command: ${resolved_yarn:-<none>}" >&2
          exit 1
        fi
        yarn --version

    - uses: actions/setup-python@v6
      if: ${{ runner.environment != 'self-hosted' }}
      with:
        python-version: '3.11'

    - name: Check cached dependencies
      id: dependency-cache-check
      if: steps.installed-dependencies-status.outputs.cache-hit == 'true'
      shell: bash
      run: |
        required=(
          node_modules/webpack/package.json
          node_modules/electron/package.json
          app/node_modules/dugite/package.json
          app/node_modules/@github/copilot/package.json
          app/node_modules/react/package.json
          app/node_modules/react/jsx-runtime.js
          app/node_modules/react-confetti/package.json
          app/node_modules/react-confetti/dist/react-confetti.mjs
        )
        case "$RUNNER_OS" in
          Windows)
            required+=(
              node_modules/electron/dist/electron.exe
              "app/node_modules/@github/copilot-win32-${{ inputs.arch }}/package.json"
            )
            ;;
          macOS)
            required+=(
              node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
              "app/node_modules/@github/copilot-darwin-${{ inputs.arch }}/package.json"
            )
            ;;
          Linux)
            required+=(
              node_modules/electron/dist/electron
              "app/node_modules/@github/copilot-linux-${{ inputs.arch }}/package.json"
            )
            ;;
        esac
        cache_complete=true
        for path in "${required[@]}"; do
          if [ ! -f "$path" ]; then
            echo "Cached dependency is incomplete: $path" >&2
            cache_complete=false
          fi
        done
        playwright_ffmpeg=false
        for root in "$HOME/.cache/ms-playwright" "$HOME/AppData/Local/ms-playwright"; do
          if [ -d "$root" ] && find "$root" \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -path "$root/ffmpeg-*/*" \
            \( -name ffmpeg-linux -o -name ffmpeg-mac -o -name ffmpeg-win64.exe \) \
            -print -quit | grep -q .; then
            playwright_ffmpeg=true
            break
          fi
        done
        if [ "$playwright_ffmpeg" != true ]; then
          echo "Cached dependency is missing Playwright ffmpeg." >&2
          cache_complete=false
        fi
        echo "complete=$cache_complete" >> "$GITHUB_OUTPUT"

    - name: Use Node.js ${{ inputs.node-version }} with installed dependencies
      if: steps.installed-dependencies-status.outputs.cache-hit == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Use Node.js ${{ inputs.node-version }} with Yarn download cache
      if:
        ${{ (steps.installed-dependencies-status.outputs.cache-hit != 'true' ||
        steps.dependency-cache-check.outputs.complete != 'true') &&
        runner.environment != 'self-hosted' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: yarn
        cache-dependency-path: |
          yarn.lock
          app/yarn.lock

    - name:
        Use Node.js ${{ inputs.node-version }} before self-hosted dependency
        install
      if:
        ${{ (steps.installed-dependencies-status.outputs.cache-hit != 'true' ||
        steps.dependency-cache-check.outputs.complete != 'true') &&
        runner.environment == 'self-hosted' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Snapshot dependency manifests before dependency install
      if:
        ${{ steps.installed-dependencies-status.outputs.cache-hit != 'true' ||
        steps.dependency-cache-check.outputs.complete != 'true' }}
      shell: bash
      run: |
        manifest_backup="$RUNNER_TEMP/desktop-material-manifests-before-cross-compilation"
        mkdir -p "$manifest_backup"
        cp package.json "$manifest_backup/root-package.json"
        cp yarn.lock "$manifest_backup/root-yarn.lock"
        cp app/package.json "$manifest_backup/app-package.json"
        cp app/yarn.lock "$manifest_backup/app-yarn.lock"

    - name: Install and build dependencies
      if:
        ${{ steps.installed-dependencies-status.outputs.cache-hit != 'true' ||
        steps.dependency-cache-check.outputs.complete != 'true' }}
      shell: bash
      run: |
        # Native packages such as dugite download platform archives during
        # postinstall. Hosted runners can occasionally lose that connection;
        # retry the complete install a small, bounded number of times.
        max_attempts=3
        for attempt in $(seq 1 "$max_attempts"); do
          if yarn --frozen-lockfile; then
            exit 0
          fi

          if [ "$attempt" -lt "$max_attempts" ]; then
            delay=$((attempt * 15))
            echo "Dependency installation failed; retrying in ${delay}s (attempt $((attempt + 1))/${max_attempts})..."
            sleep "$delay"
          fi
        done

        exit 1
      env:
        npm_config_arch: ${{ inputs.arch }}
        TARGET_ARCH: ${{ inputs.arch }}

    - name: Install cross-compilation copilot package
      if:
        ${{ steps.installed-dependencies-status.outputs.cache-hit != 'true' ||
        steps.dependency-cache-check.outputs.complete != 'true' }}
      shell: bash
      run: |
        # Map runner.os to Node's process.platform naming
        case "$RUNNER_OS" in
          macOS)   PLATFORM=darwin ;;
          Windows) PLATFORM=win32 ;;
          Linux)   PLATFORM=linux ;;
        esac

        PKG="@github/copilot-${PLATFORM}-${{ inputs.arch }}"
        PKG_VERSION=$(node -p "require('./app/node_modules/@github/copilot/package.json').version")

        if [ ! -d "app/node_modules/@github/copilot-${PLATFORM}-${{ inputs.arch }}" ]; then
          echo "Installing ${PKG}@${PKG_VERSION} for cross-compilation…"
          for attempt in 1 2 3; do
            if (cd app && yarn add --optional --ignore-platform --ignore-scripts "${PKG}@${PKG_VERSION}"); then
              install_succeeded=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "Install failed; retrying in ${delay} seconds (attempt $((attempt + 1)) of 3)."
              sleep "$delay"
            fi
          done

          if [ "${install_succeeded:-false}" != "true" ]; then
            echo "Failed to install ${PKG}@${PKG_VERSION} after 3 attempts."
            exit 1
          fi
        fi

    - name: Restore dependency manifests after cross-compilation install
      if:
        ${{ steps.installed-dependencies-status.outputs.cache-hit != 'true' ||
        steps.dependency-cache-check.outputs.complete != 'true' }}
      shell: bash
      run: |
        manifest_backup="$RUNNER_TEMP/desktop-material-manifests-before-cross-compilation"
        cp "$manifest_backup/root-package.json" package.json
        cp "$manifest_backup/root-yarn.lock" yarn.lock
        cp "$manifest_backup/app-package.json" app/package.json
        cp "$manifest_backup/app-yarn.lock" app/yarn.lock
        if ! cmp -s "$manifest_backup/root-package.json" package.json ||
          ! cmp -s "$manifest_backup/root-yarn.lock" yarn.lock ||
          ! cmp -s "$manifest_backup/app-package.json" app/package.json ||
          ! cmp -s "$manifest_backup/app-yarn.lock" app/yarn.lock; then
          echo 'Cross-compilation dependency install changed a cache-key manifest.' >&2
          exit 1
        fi

    - name: Verify installed dependencies before use
      id: verify-dependencies
      shell: bash
      run: |
        required=(
          node_modules/webpack/package.json
          node_modules/electron/package.json
          app/node_modules/dugite/package.json
          app/node_modules/@github/copilot/package.json
          app/node_modules/react/package.json
          app/node_modules/react/jsx-runtime.js
          app/node_modules/react-confetti/package.json
          app/node_modules/react-confetti/dist/react-confetti.mjs
        )
        case "$RUNNER_OS" in
          Windows)
            required+=(
              node_modules/electron/dist/electron.exe
              "app/node_modules/@github/copilot-win32-${{ inputs.arch }}/package.json"
            )
            ;;
          macOS)
            required+=(
              node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
              "app/node_modules/@github/copilot-darwin-${{ inputs.arch }}/package.json"
            )
            ;;
          Linux)
            required+=(
              node_modules/electron/dist/electron
              "app/node_modules/@github/copilot-linux-${{ inputs.arch }}/package.json"
            )
            ;;
        esac
        for path in "${required[@]}"; do
          if [ ! -f "$path" ]; then
            echo "Installed dependency cache is incomplete: $path" >&2
            exit 1
          fi
        done
        playwright_ffmpeg=false
        for root in "$HOME/.cache/ms-playwright" "$HOME/AppData/Local/ms-playwright"; do
          if [ -d "$root" ] && find "$root" \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -path "$root/ffmpeg-*/*" \
            \( -name ffmpeg-linux -o -name ffmpeg-mac -o -name ffmpeg-win64.exe \) \
            -print -quit | grep -q .; then
            playwright_ffmpeg=true
            break
          fi
        done
        if [ "$playwright_ffmpeg" != true ]; then
          echo "Installed dependencies are missing Playwright ffmpeg; refusing to save or use this exact cache key." >&2
          exit 1
        fi

    - name: Save exact installed dependencies from Windows self-hosted runners
      if:
        ${{ runner.os == 'Windows' && runner.environment == 'self-hosted' &&
        (steps.installed-dependencies-self-hosted.outputs.cache-hit != 'true' ||
        steps.dependency-cache-check.outputs.complete != 'true') &&
        steps.verify-dependencies.outcome == 'success' }}
      uses: actions/cache/save@v5
      with:
        path: |
          node_modules
          app/node_modules
          ~/.cache/ms-playwright
          ~/AppData/Local/ms-playwright
        key: >-
          installed-deps-v6-${{ runner.os }}-${{ runner.arch }}-runner-${{
          steps.windows-toolchain.outputs.cache-suffix }}-target-${{ inputs.arch
          }}-node-${{ inputs.node-version }}-py311-${{ hashFiles('package.json',
          'yarn.lock', 'app/package.json', 'app/yarn.lock', '.yarnrc',
          'app/.yarnrc', 'app/.npmrc', 'script/post-install.ts',
          '.github/actions/setup-ci-environment/action.yml',
          '.github/scripts/ensure-windows-git-bash.ps1',
          '.github/scripts/ensure-windows-arm64-build-tools.ps1',
          '.github/scripts/ensure-windows-clang.ps1',
          '.github/scripts/bootstrap-pinned-yarn.ps1', 'vendor/yarn-1.21.1.js',
          'vendor/printenvz/**', 'vendor/windows-argv-parser/**',
          'vendor/desktop-notifications/**', 'vendor/desktop-trampoline/**') }}
