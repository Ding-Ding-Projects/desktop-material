name: Setup GitHub CLI
description:
  Make the pinned GitHub CLI available without changing the runner installation.

inputs:
  version:
    description: GitHub CLI version to install when it is missing.
    required: false
    default: '2.97.0'

runs:
  using: composite
  steps:
    - name: Reuse or install the pinned GitHub CLI
      shell: bash
      env:
        GH_CLI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if command -v gh >/dev/null 2>&1; then
          gh --version
          exit 0
        fi

        if [ "${RUNNER_OS:-}" != "Linux" ]; then
          echo "GitHub CLI is missing on a non-Linux runner and cannot use this bootstrap." >&2
          exit 1
        fi

        case "$(uname -m)" in
          x86_64) archive_arch=amd64 ;;
          aarch64|arm64) archive_arch=arm64 ;;
          *) echo "Unsupported Linux architecture for GitHub CLI: $(uname -m)" >&2; exit 1 ;;
        esac

        archive="gh_${GH_CLI_VERSION}_linux_${archive_arch}.tar.gz"
        install_root="$RUNNER_TEMP/github-cli/gh_${GH_CLI_VERSION}_linux_${archive_arch}"
        download_root="$RUNNER_TEMP/github-cli-download"
        mkdir -p "$download_root"

        curl --fail --location --retry 3 --silent --show-error \
          "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/${archive}" \
          --output "$download_root/$archive"
        curl --fail --location --retry 3 --silent --show-error \
          "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_checksums.txt" \
          --output "$download_root/checksums.txt"
        checksum=$(awk -v name="$archive" '$2 == name { print $1; exit }' "$download_root/checksums.txt")
        if [ -z "$checksum" ]; then
          echo "GitHub CLI checksum is missing for $archive." >&2
          exit 1
        fi
        printf '%s  %s\n' "$checksum" "$download_root/$archive" | sha256sum -c -

        rm -rf "$install_root"
        mkdir -p "$(dirname "$install_root")"
        tar -xzf "$download_root/$archive" -C "$(dirname "$install_root")"
        bin_dir="$install_root/bin"
        if [ ! -x "$bin_dir/gh" ]; then
          echo "GitHub CLI archive did not contain an executable at $bin_dir/gh." >&2
          exit 1
        fi
        printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
        export PATH="$bin_dir:$PATH"
        gh --version
