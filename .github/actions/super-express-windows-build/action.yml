name: Build unsigned Super Express Windows package
description: Build, verify, and preserve the unsigned Windows release payload
inputs:
  release_target_sha:
    description: Exact commit SHA being packaged
    required: true
  release_version:
    description: Squirrel-compatible package version
    required: false
    default: ''
  node_version:
    description: Node.js version used by the package
    required: true
outputs:
  release_version:
    description: Squirrel-compatible version produced for this workflow attempt
    value: ${{ steps.resolve_version.outputs.release_version }}
  release_tag:
    description: Immutable Git tag produced for this workflow attempt
    value: ${{ steps.resolve_version.outputs.release_tag }}
  artifact_name:
    description: Actions artifact name containing the Windows release payload
    value: super-express-windows-${{ github.run_id }}-${{ github.run_attempt }}
runs:
  using: composite
  steps:
    - name: Prefer Git Bash on Windows self-hosted runners
      shell: cmd
      run: "%GITHUB_WORKSPACE%\\.github\\scripts\\ensure-windows-git-bash.cmd"

    - name: Require a main-branch manual dispatch
      if: ${{ github.event_name == 'workflow_dispatch' }}
      shell: bash
      run: |
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "Direct Super Express Windows dispatches must use main." >&2
          exit 1
        fi

    - name: Require the exact release commit
      shell: bash
      env:
        RELEASE_TARGET_SHA: ${{ inputs.release_target_sha }}
      run: |
        checked_out=$(git rev-parse HEAD)
        if [ "$checked_out" != "$RELEASE_TARGET_SHA" ]; then
          echo "Checked-out commit $checked_out does not match $RELEASE_TARGET_SHA." >&2
          exit 1
        fi

    - uses: ./.github/actions/setup-ci-environment
      with:
        node-version: ${{ inputs.node_version }}
        arch: x64

    - name: Resolve release package version
      id: resolve_version
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: |
        if [ -z "$RELEASE_VERSION" ]; then
          base=$(node -p "require('./app/package.json').version")
          version=$(node script/release-version.js create "$base" "${{ github.run_id }}" "${{ github.run_attempt }}")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
        else
          base=$(node -p "require('./app/package.json').version")
          node script/release-version.js validate "$RELEASE_VERSION" "$base"
          version="$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
        fi
        echo "release_version=$version" >> "$GITHUB_OUTPUT"
        echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

    - name: Apply the release package version
      shell: bash
      run: |
        RELEASE_VERSION="$RELEASE_VERSION" node -e "const fs=require('fs');const f='./app/package.json';const p=require(f);p.version=process.env.RELEASE_VERSION;fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\\n')"

    - name: Build production app
      shell: bash
      run: yarn build:prod
      env:
        NODE_ENV: production
        RELEASE_CHANNEL: beta
        WEBPACK_DISABLE_CONCURRENT_RECOMPILATION: '1'
        npm_config_arch: x64
        TARGET_ARCH: x64

    - name: Package Windows x64
      shell: bash
      run: yarn package
      env:
        NODE_ENV: production
        RELEASE_CHANNEL: beta
        WINDOWS_SIGNING_ENABLED: 'false'
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        CSC_LINK: ''
        CSC_KEY_PASSWORD: ''
        WIN_CSC_LINK: ''
        WIN_CSC_KEY_PASSWORD: ''
        AZURE_CLIENT_ID: ''
        AZURE_TENANT_ID: ''
        npm_config_arch: x64
        TARGET_ARCH: x64

    - name: Collect and verify Windows release payload
      shell: bash
      run: |
        mkdir -p release-payload/installers
        shopt -s nullglob
        for file in \
          "dist/GitHub Desktop-x64.zip" \
          dist/GitHubDesktop-*.nupkg \
          "dist/GitHubDesktopSetup-x64.exe" \
          "dist/GitHubDesktopSetup-x64.msi"; do
          [ -e "$file" ] && cp "$file" release-payload/installers/
        done

        if [ -e dist/RELEASES ]; then
          # Squirrel installs the highest version the manifest names, so the
          # published feed must only ever name this package at this version.
          node script/release-version.js filter "$RELEASE_VERSION" \
            < dist/RELEASES > release-payload/installers/RELEASES
          while read -r _sha name _size || [[ -n "$name" ]]; do
            [ -z "$name" ] && continue
            [ -e "release-payload/installers/$name" ] && continue
            case "$name" in
              *-full.nupkg)
                source=$(find dist -maxdepth 1 -type f -name '*-full.nupkg' -print | LC_ALL=C sort | sed -n '1p')
                ;;
              *-delta.nupkg)
                source=$(find dist -maxdepth 1 -type f -name '*-delta.nupkg' -print | LC_ALL=C sort | sed -n '1p')
                ;;
              *) source="" ;;
            esac
            if [[ "$name" == *-full.nupkg || "$name" == *-delta.nupkg ]] && \
               [ -z "$source" ]; then
              echo "RELEASES names $name, but no matching source package exists." >&2
              exit 1
            fi
            [ -n "$source" ] && \
              cp "$source" "release-payload/installers/$name"
          done < release-payload/installers/RELEASES
        fi

        required=(
          release-payload/installers/RELEASES
          "release-payload/installers/GitHub Desktop-x64.zip"
          release-payload/installers/GitHubDesktopSetup-x64.exe
          release-payload/installers/GitHubDesktopSetup-x64.msi
          "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-full.nupkg"
          "release-payload/installers/GitHubDesktop-${RELEASE_VERSION}-x64-full.nupkg"
        )
        for asset in "${required[@]}"; do
          if [ ! -s "$asset" ]; then
            echo "Missing or empty Windows release asset: $asset" >&2
            exit 1
          fi
        done

        node script/verify-releases-manifest.js \
          release-payload/installers/RELEASES \
          release-payload/installers

    - name: Require unsigned Windows release installers
      shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
      run: |
        $installers = @(
          'release-payload\installers\GitHubDesktopSetup-x64.exe',
          'release-payload\installers\GitHubDesktopSetup-x64.msi'
        )
        foreach ($installer in $installers) {
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Unsigned installer is missing: $installer"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Installer must remain unsigned: ${installer} reported $($signature.Status)"
          }
          Write-Host "Unsigned installer verified: $installer"
        }

    - name: Preserve Windows payload artifact
      uses: actions/upload-artifact@v7
      with:
        name:
          super-express-windows-${{ github.run_id }}-${{ github.run_attempt }}
        path: release-payload/installers/
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
