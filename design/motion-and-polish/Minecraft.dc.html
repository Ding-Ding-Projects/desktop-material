<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minecraft server manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,400,0..1&amp;display=swap">
<style>
body{margin:0}
a{color:#006493}a:hover{color:#004b70}
.dm{--p:#006493;--onp:#fff;--pc:#c9e6ff;--onpc:#001e30;--sc:#d3e5f5;--onsc:#0c1d29;--bg:#f8f9ff;--s0:#fff;--s1:#f2f3f9;--s2:#eceef4;--s3:#e6e8ee;--s4:#e0e2e8;--on:#191c20;--onv:#41474d;--ol:#71787e;--olv:#c1c7ce;--ok:#1b7f37;--okc:#d2f2d8;--am:#9a6700;--amc:#ffe9b8;--inv:#2e3135;--oninv:#eff1f7;
--d-s:200ms;--d-m:300ms;--d-l:500ms;--e-emph:cubic-bezier(.2,0,0,1);--e-dec:cubic-bezier(.05,.7,.1,1);--e-spring:cubic-bezier(.38,1.21,.22,1);
font-family:Roboto,'Segoe UI',system-ui,sans-serif;color:var(--on);background:var(--bg);min-height:960px}
.dm.dark{--p:#8dcdff;--onp:#00344f;--pc:#004b70;--onpc:#c9e6ff;--sc:#394956;--onsc:#d3e5f5;--bg:#101418;--s0:#0b0f12;--s1:#181c20;--s2:#1c2024;--s3:#272a2f;--s4:#32353a;--on:#e0e2e8;--onv:#c1c7ce;--ol:#8b9198;--olv:#41474d;--ok:#7bd88f;--okc:#0f3d1c;--am:#f5c26b;--amc:#4a3300;--inv:#e0e2e8;--oninv:#2e3135}
.ms{font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-variation-settings:'FILL' 0,'wght' 400;display:inline-block;vertical-align:middle}
.wrap{max-width:1240px;margin:0 auto;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:28px;font-weight:500}
h2{margin:0;font-size:17px;font-weight:500;display:flex;align-items:center;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.icon-btn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--onv);transition:background var(--d-s)}
.icon-btn:hover{background:var(--s3)}.icon-btn:focus-visible{outline:3px solid var(--p)}
.icon-btn.sm{width:32px;height:32px}
.btn{all:unset;cursor:pointer;height:40px;padding:0 16px;border-radius:999px;background:var(--p);color:var(--onp);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:transform var(--d-m) var(--e-spring),border-radius var(--d-m) var(--e-spring),opacity var(--d-m)}
.btn:active{transform:scale(.96);border-radius:12px}.btn:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.btn.tonal{background:var(--sc);color:var(--onsc)}.btn.out{background:transparent;color:var(--p);box-shadow:inset 0 0 0 1px var(--ol)}
.btn[disabled]{opacity:.38;cursor:default;transform:none}
.tabs{display:flex;gap:4px;align-items:flex-end;border-bottom:1px solid var(--olv);overflow-x:auto}
.tab{all:unset;cursor:pointer;height:40px;padding:0 12px 0 14px;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--onv);background:transparent;white-space:nowrap;transition:background var(--d-m),color var(--d-m)}
.tab.on{background:var(--s1);color:var(--on)}.tab:focus-visible{outline:3px solid var(--p);outline-offset:-3px}
.dotst{width:8px;height:8px;border-radius:8px;background:var(--ol)}.dotst.run{background:var(--ok);box-shadow:0 0 0 0 rgba(27,127,55,.5);animation:beat 1.8s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(27,127,55,.5)}100%{box-shadow:0 0 0 8px rgba(27,127,55,0)}}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.card{background:var(--s1);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}.f.full{grid-column:1/-1}
.f label,.lab{font-size:12px;font-weight:500;color:var(--onv)}
.sel{all:unset;height:44px;border-radius:12px;background:var(--s0);padding:0 12px;box-shadow:inset 0 0 0 1px var(--ol);font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.sel select{all:unset;flex:1;cursor:pointer}
.inp{all:unset;height:44px;border-radius:12px;background:var(--s0);padding:0 12px;box-shadow:inset 0 0 0 1px var(--ol);font-family:'Roboto Mono',monospace;font-size:13px;transition:box-shadow var(--d-m)}
.inp:focus{box-shadow:inset 0 0 0 2px var(--p)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--ol);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;transition:background var(--d-m),border-color var(--d-m)}
.chip.on{background:var(--sc);border-color:var(--sc);color:var(--onsc)}.chip:focus-visible{outline:3px solid var(--p)}
.gridwrap{position:relative;aspect-ratio:1/1;max-height:340px;border-radius:16px;background:var(--s0);overflow:hidden;touch-action:none;background-image:linear-gradient(var(--s3) 1px,transparent 1px),linear-gradient(90deg,var(--s3) 1px,transparent 1px);background-size:5% 5%}
.area{position:absolute;border:2px solid var(--p);background:color-mix(in srgb,var(--p) 16%,transparent);border-radius:6px;cursor:move;transition:width var(--d-m) var(--e-spring),height var(--d-m) var(--e-spring)}
.area:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.area span{position:absolute;left:6px;top:4px;font-size:11px;font-weight:700;color:var(--p);font-family:'Roboto Mono',monospace}
.spawn{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:10px;background:var(--am)}
.step{display:flex;align-items:center;gap:6px}
.step b{font-family:'Roboto Mono',monospace;font-size:14px;min-width:44px;text-align:center}
.eula{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:18px;background:var(--amc);color:var(--on);border-radius:14px;padding:12px}
.console{background:#0b0f12;color:#c1c7ce;border-radius:16px;padding:12px;font-family:'Roboto Mono',monospace;font-size:12px;line-height:18px;height:170px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.console div{animation:ln var(--d-m) var(--e-dec) both}
@keyframes ln{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.console .g{color:#7bd88f}.console .y{color:#f5c26b}
.prog{height:6px;border-radius:6px;background:var(--s3);overflow:hidden}.prog i{display:block;height:100%;background:var(--p);transition:width var(--d-l) var(--e-emph)}
.where{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:700px){.where{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wh{all:unset;cursor:pointer;border-radius:14px;background:var(--s0);padding:10px;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px var(--olv);transition:box-shadow var(--d-m),background var(--d-m)}
.wh.on{box-shadow:inset 0 0 0 2px var(--p);background:var(--pc);color:var(--onpc)}.wh:focus-visible{outline:3px solid var(--p)}
.wh small{font-weight:400;font-size:11px;opacity:.8}
</style>
</helmet>
<div class="dm {{rootClass}}">
<div class="wrap">
<div class="bar"><div style="flex:1"><h1>Minecraft servers</h1></div><button class="btn"><span class="ms">add</span>New server</button><button class="icon-btn" onClick="{{toggleDark}}" aria-label="Switch light and dark"><span class="ms">contrast</span></button></div>
<div class="tabs" role="tablist">
<sc-for list="{{servers}}" as="sv" hint-placeholder-count="3"><button class="{{sv.cls}}" role="tab" aria-selected="{{sv.on}}" onClick="{{sv.pick}}"><span class="{{sv.dot}}"></span>{{sv.name}}<small style="color:var(--onv);font-weight:400">{{sv.ver}}</small></button></sc-for>
</div>
<div class="cols">
<div class="card" style="flex:1 1 420px">
<h2><span class="ms">dns</span>Server</h2>
<div class="lab">Runs on</div>
<div class="where"><sc-for list="{{wheres}}" as="w" hint-placeholder-count="4"><button class="{{w.cls}}" onClick="{{w.pick}}" aria-pressed="{{w.on}}"><span class="ms">{{w.icon}}</span>{{w.label}}<small>{{w.hint}}</small></button></sc-for></div>
<div class="lab">Flavour</div>
<div class="chips"><sc-for list="{{flavours}}" as="fl" hint-placeholder-count="6"><button class="{{fl.cls}}" onClick="{{fl.pick}}" aria-pressed="{{fl.on}}">{{fl.label}}</button></sc-for></div>
<div class="form">
<div class="f"><label for="ver">Version</label><span class="sel"><span class="ms">sell</span><select id="ver"><option>1.21.4 (release)</option><option>25w45a (snapshot)</option><option>1.20.6 (release)</option><option>1.8.9 (legacy)</option></select></span></div>
<div class="f"><label for="ram">Memory</label><span class="sel"><span class="ms">memory</span><select id="ram"><option>4 GB</option><option>6 GB</option><option>8 GB</option></select></span></div>
<div class="f full"><label>Java runtime</label><span class="sel" style="cursor:default"><span class="ms">coffee</span>Temurin 21 (bundled, matches 1.21.4)</span></div>
</div>
<div class="bar"><button class="btn" onClick="{{toggleRun}}"><span class="ms">{{runIcon}}</span>{{runLabel}}</button><button class="btn tonal"><span class="ms">extension</span>Plugins and mods</button><button class="btn out"><span class="ms">settings</span>server.properties</button></div>
<div class="console" role="log" aria-label="Server console"><sc-for list="{{log}}" as="l" hint-placeholder-count="5"><div class="{{l.c}}">{{l.t}}</div></sc-for></div>
</div>
<div class="card" style="flex:1 1 440px">
<h2><span class="ms">public</span>World generator</h2>
<div class="form">
<div class="f"><label for="seed">Seed</label><input id="seed" class="inp" value="-4172144997902289642"></div>
<div class="f"><label for="preset">Preset</label><span class="sel"><span class="ms">landscape</span><select id="preset"><option>Default</option><option>Large biomes</option><option>Amplified</option><option>Superflat</option><option>Single biome</option></select></span></div>
</div>
<div class="lab">Area to pre-generate · drag the box, or use the arrow keys when it has focus</div>
<div class="gridwrap" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}">
<span class="spawn" aria-hidden="true"></span>
<div class="area" tabindex="0" role="slider" aria-label="Generation area" aria-valuetext="{{areaText}}" style="left:{{ax}};top:{{ay}};width:{{aw}};height:{{ah}}" onPointerDown="{{onDown}}" onKeyDown="{{onKey}}"><span>{{w}} × {{h}}</span></div>
</div>
<div class="bar"><span class="lab">Width</span><span class="step"><button class="icon-btn sm" aria-label="Narrower" onClick="{{wDown}}"><span class="ms">remove</span></button><b>{{w}}</b><button class="icon-btn sm" aria-label="Wider" onClick="{{wUp}}"><span class="ms">add</span></button></span>
<span class="lab" style="margin-left:12px">Height</span><span class="step"><button class="icon-btn sm" aria-label="Shorter" onClick="{{hDown}}"><span class="ms">remove</span></button><b>{{h}}</b><button class="icon-btn sm" aria-label="Taller" onClick="{{hUp}}"><span class="ms">add</span></button></span><span class="lab" style="margin-left:auto">{{chunks}} chunks</span></div>
<div class="bar"><span class="lab">Save to</span><span class="chips"><button class="{{outFolder}}" onClick="{{setFolder}}">Folder</button><button class="{{outZip}}" onClick="{{setZip}}">ZIP</button></span><input class="inp" style="flex:1;min-width:160px" value="{{outPath}}" aria-label="Output path"><button class="btn out"><span class="ms">folder_open</span>Browse</button></div>
<label class="eula"><input type="checkbox" checked="{{eula}}" onChange="{{toggleEula}}"><span>I accept the Minecraft End User License Agreement. Generation runs this exact server version locally and only starts after you tick this.</span></label>
<div class="bar"><button class="btn" disabled="{{genDisabled}}" onClick="{{gen}}"><span class="ms">auto_awesome_mosaic</span>Generate world</button><span class="lab">{{genText}}</span></div>
<div class="prog"><i style="width:{{genPct}}"></i></div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  constructor(p){super(p);this.state={dark:false,srv:0,where:0,fl:1,run:true,x:30,y:30,w:100,h:100,drag:null,out:'zip',eula:false,gen:-1,log:[['','[14:02:11] Starting Minecraft server version 1.21.4'],['','[14:02:12] Loading properties'],['','[14:02:14] Preparing level "world"'],['g','[14:02:19] Done (5.12s)! For help, type "help"'],['','[14:03:40] Sam joined the game']]};}
  componentDidMount(){this._i=setInterval(()=>{const s=this.state;if(s.gen>=0&&s.gen<100)this.setState({gen:Math.min(100,s.gen+9)});if(s.run&&Math.random()<.4){const msgs=[['','[tick] Saved the game'],['y','[warn] Can\u2019t keep up! 2034ms behind'],['','[chat] <Sam> nice spawn'],['g','[info] Backup finished, 412 MB']];this.setState({log:[...s.log,msgs[Math.floor(Math.random()*4)]].slice(-6)});}},1100);}
  componentWillUnmount(){clearInterval(this._i);}
  renderVals(){
    const s=this.state;const SZ=400;const pct=v=>(v/SZ*100)+'%';
    const servers=[{name:'Survival',ver:'1.21.4 Paper'},{name:'Creative test',ver:'25w45a'},{name:'Bedrock family',ver:'1.21.50'}];
    const wh=[['desktop_windows','This PC','Windows process'],['deployed_code','Docker','On this PC'],['terminal','SSH','Remote process'],['cloud','SSH Docker','Remote container']];
    const fls=['Vanilla','Paper','Purpur','Fabric','Forge','NeoForge','Bedrock'];
    const clampXY=(x,y)=>({x:Math.max(0,Math.min(SZ-s.w,x)),y:Math.max(0,Math.min(SZ-s.h,y))});
    const setW=v=>this.setState({w:Math.max(10,Math.min(SZ,v)),x:Math.min(s.x,SZ-Math.max(10,Math.min(SZ,v)))});
    const setH=v=>this.setState({h:Math.max(10,Math.min(SZ,v)),y:Math.min(s.y,SZ-Math.max(10,Math.min(SZ,v)))});
    return {
      rootClass:s.dark?'dark':'',toggleDark:()=>this.setState({dark:!s.dark}),
      servers:servers.map((v,i)=>({...v,on:s.srv===i,cls:'tab'+(s.srv===i?' on':''),dot:'dotst'+(i===0&&s.run?' run':''),pick:()=>this.setState({srv:i})})),
      wheres:wh.map((w,i)=>({icon:w[0],label:w[1],hint:w[2],on:s.where===i,cls:'wh'+(s.where===i?' on':''),pick:()=>this.setState({where:i})})),
      flavours:fls.map((l,i)=>({label:l,on:s.fl===i,cls:'chip'+(s.fl===i?' on':''),pick:()=>this.setState({fl:i})})),
      runIcon:s.run?'stop':'play_arrow',runLabel:s.run?'Stop':'Start',toggleRun:()=>this.setState({run:!s.run}),
      log:s.log.map(l=>({c:l[0],t:l[1]})),
      ax:pct(s.x),ay:pct(s.y),aw:pct(s.w),ah:pct(s.h),w:s.w,h:s.h,chunks:(s.w*s.h).toLocaleString(),areaText:s.w+' by '+s.h+' chunks',
      onDown:e=>{e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId);const r=e.currentTarget.parentElement.getBoundingClientRect();this.setState({drag:{px:e.clientX,py:e.clientY,x:s.x,y:s.y,k:SZ/r.width}});},
      onMove:e=>{if(!s.drag)return;const d=s.drag;this.setState(clampXY(Math.round(d.x+(e.clientX-d.px)*d.k),Math.round(d.y+(e.clientY-d.py)*d.k)));},
      onUp:()=>{if(s.drag)this.setState({drag:null});},
      onKey:e=>{const st=e.shiftKey?20:5;let p=null;if(e.key==='ArrowLeft')p=clampXY(s.x-st,s.y);if(e.key==='ArrowRight')p=clampXY(s.x+st,s.y);if(e.key==='ArrowUp')p=clampXY(s.x,s.y-st);if(e.key==='ArrowDown')p=clampXY(s.x,s.y+st);if(p){e.preventDefault();this.setState(p);}},
      wDown:()=>setW(s.w-10),wUp:()=>setW(s.w+10),hDown:()=>setH(s.h-10),hUp:()=>setH(s.h+10),
      outFolder:'chip'+(s.out==='folder'?' on':''),outZip:'chip'+(s.out==='zip'?' on':''),setFolder:()=>this.setState({out:'folder'}),setZip:()=>this.setState({out:'zip'}),
      outPath:s.out==='zip'?'D:\\Worlds\\survival-pregen.zip':'D:\\Worlds\\survival-pregen',
      eula:s.eula,toggleEula:()=>this.setState({eula:!s.eula}),genDisabled:!s.eula,gen:()=>this.setState({gen:0}),
      genPct:(s.gen<0?0:s.gen)+'%',genText:s.gen<0?(s.eula?'Ready':'Accept the EULA first'):s.gen>=100?'Done · verified and saved':'Generating batch '+Math.ceil(s.gen/10+0.01)+' of 10'
    };
  }
}
</script>
</body>
</html>
