<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desktop Material download handoff</title>
  </head>
  <body>
    <main>
      <h1>Desktop Material download handoff</h1>
      <p>
        Choose the local Windows folder where confirmed downloads will be
        written.
      </p>
      <label for="destination">Destination folder</label>
      <input
        id="destination"
        type="text"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="save" type="button">Save</button>
      <p id="status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
