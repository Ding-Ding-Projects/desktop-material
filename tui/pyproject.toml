[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "desktop-material-tui"
version = "0.1.0"
description = "A Linux-first, fully interactive terminal edition of Desktop Material"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ding Ding Projects" },
]
keywords = ["git", "github", "linux", "terminal", "textual", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "google-re2==1.1.20251105",
  "httpx>=0.28.1,<1",
  "keyring>=25.6.0,<26",
  "platformdirs>=4.3.8,<5",
  "textual[syntax]==8.2.8",
  "tomli>=2.2.1,<3; python_version < '3.11'",
  "tomli-w>=1.2.0,<2",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.8,<8",
  "hypothesis>=6.135,<7",
  "mypy>=1.16,<2",
  "pexpect>=4.9,<5; sys_platform != 'win32'",
  "pyte>=0.8.2,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
desktop-material-tui = "desktop_material_tui.__main__:main"
dmt = "desktop_material_tui.__main__:main"
github = "desktop_material_tui.__main__:main"

[project.urls]
Homepage = "https://github.com/Ding-Ding-Projects/desktop-material"
Documentation = "https://ding-ding-projects.github.io/desktop-material/"
Issues = "https://github.com/Ding-Ding-Projects/desktop-material/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_material_tui"]

[tool.hatch.build.targets.sdist]
include = [
  ".dockerignore",
  "contracts/",
  "Dockerfile",
  "src/",
  "tests/",
  "README.md",
  "pyproject.toml",
  "uv.lock",
]
exclude = [
  "**/__pycache__/",
  "**/*.pyc",
]

[tool.uv]
required-version = ">=0.11.26,<0.12"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["desktop_material_tui"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = [
  "S101",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["desktop_material_tui"]
