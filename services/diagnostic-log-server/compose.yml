services:
  diagnostic-log-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: desktop-material-diagnostic-log-server:2026-07-29
    container_name: desktop-material-diagnostic-log-server
    restart: unless-stopped
    init: true
    user: '${LOG_SERVER_UID:-1000}:${LOG_SERVER_GID:-1000}'
    ports:
      - '${LOG_SERVER_BIND_ADDRESS:-192.168.50.242}:${LOG_SERVER_PORT:-4318}:4318'
    environment:
      STORAGE_ROOT: /data
      TOKEN_FILE: /run/secrets/diagnostic-log-token
      RETENTION_DAYS: '${LOG_SERVER_RETENTION_DAYS:-14}'
      MAX_STORAGE_BYTES: '${LOG_SERVER_MAX_STORAGE_BYTES:-5368709120}'
    volumes:
      - type: bind
        source: '${LOG_SERVER_STORAGE_PATH:-./data}'
        target: /data
      - type: bind
        source: './secrets/diagnostic-log-token'
        target: /run/secrets/diagnostic-log-token
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 192m
    cpus: 0.50
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
